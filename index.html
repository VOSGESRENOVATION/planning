<body>
<header class="bandeau">
  <span class="soc">Vosges Rénovation</span>
  <span class="quoi" id="quoi">Planning chantiers</span>
  <span class="qui" id="qui"></span>
</header>
<div id="etat" class="etat"></div>
<main id="app"><div class="chargement">Chargement…</div></main>
<div id="toast"></div>
<div id="impression"></div>

<script type="application/json" id="conf"><?!= conf ?></script>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------------------------------
  // Configuration et appel au serveur Google
  // ------------------------------------------------------------------------------------------
  var CONF = { code: '', role: '' }; // le rôle arrive avec le premier appel
  try { CONF = JSON.parse(document.getElementById('conf').textContent); } catch (e) { /* page ouverte hors Google */ }
  // Page déposée hors de Google : le code est dans l'adresse de la page (…?k=code)
  if (!CONF.code) {
    var m = /[?&]k=([0-9a-zA-Z]+)/.exec(location.search);
    if (m) CONF.code = m[1];
  }
  if (window.__ESSAI) CONF = window.__ESSAI.conf;

  // Adresse de l'appli Google (…/exec) : sert quand la page est déposée ailleurs (GitHub Pages)
  var ADRESSE_GOOGLE = 'https://script.google.com/macros/s/AKfycby3jxyEgdf4tUBHajArPngdO1NGmltadz_FFklFFCVc82DTcabMZPZFRFc0Pw9yhLP2SQ/exec';

  function api(action, donnees) {
    return new Promise(function (ok, ko) {
      var minuteur = setTimeout(function () { ko(new Error('Google ne répond pas (plus de 25 secondes, « ' + action + ' »).')); }, 25000);
      var reponse = function (r) { clearTimeout(minuteur); if (r && r.ok) ok(r.res); else ko(new Error((r && r.erreur) || 'Erreur inconnue.')); };
      var panne = function (e) { clearTimeout(minuteur); ko(new Error('Connexion impossible (' + ((e && e.message) || e) + '). Vérifiez le réseau et réessayez.')); };
      if (window.google && google.script && google.script.run) {
        // Page affichée par Google
        google.script.run.withSuccessHandler(reponse).withFailureHandler(panne).appel(CONF.code, action, donnees || {});
      } else if (ADRESSE_GOOGLE) {
        // Page déposée ailleurs : même demande, envoyée à Google par Internet
        fetch(ADRESSE_GOOGLE, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ code: CONF.code, action: action, donnees: donnees || {} })
        }).then(function (x) { return x.json(); }).then(reponse, panne);
      } else {
        clearTimeout(minuteur);
        ko(new Error('Page ouverte hors de Google, sans adresse de l\'appli.'));
      }
    });
  }

  // Une erreur de la page elle-même s'affiche au lieu de laisser l'écran figé
  window.addEventListener('error', function (e) { toast('Erreur de la page : ' + e.message); });
  window.addEventListener('unhandledrejection', function (e) { toast('Erreur de la page : ' + ((e.reason && e.reason.message) || e.reason)); });

  // ------------------------------------------------------------------------------------------
  // Outils : dates, heures, texte
  // ------------------------------------------------------------------------------------------
  var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var MOIS = ['janv.', 'févr.', 'mars', 'avril', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  var PAUSES = [0, 15, 30, 45, 60, 75, 90, 105, 120];

  function d(s) { return new Date(s + 'T00:00:00Z'); }
  function plusJours(s, n) { var x = d(s); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
  function maj(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  function jourLong(s) { var x = d(s); return maj(JOURS[x.getUTCDay()]) + ' ' + x.getUTCDate() + ' ' + MOIS[x.getUTCMonth()]; }
  function jourCourt(s) { var x = d(s); return maj(JOURS[x.getUTCDay()].slice(0, 3)) + '. ' + x.getUTCDate(); }
  function titreSemaine(lundi) {
    var a = d(lundi), b = d(plusJours(lundi, 6));
    return 'Semaine du ' + a.getUTCDate() + (a.getUTCMonth() !== b.getUTCMonth() ? ' ' + MOIS[a.getUTCMonth()] : '')
      + ' au ' + b.getUTCDate() + ' ' + MOIS[b.getUTCMonth()];
  }
  /** « 830 », « 0830 », « 8h30 », « 8:30 », « 17 » → « 08:30 » / « 17:00 » ; '' si ce n'est pas une heure. */
  function lireHeure(t) {
    var x = String(t || '').trim().toLowerCase().replace(/\s/g, '');
    var h, m, r = x.match(/^(\d{1,2})[h:.,](\d{2})?$/);
    if (r) { h = Number(r[1]); m = Number(r[2] || 0); }
    else if (/^\d{1,2}$/.test(x)) { h = Number(x); m = 0; }
    else if (/^\d{3,4}$/.test(x)) { h = Number(x.slice(0, x.length - 2)); m = Number(x.slice(-2)); }
    else return '';
    if (h > 23 || m > 59) return '';
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  function min(h) { var p = String(h).split(':'); return Number(p[0]) * 60 + Number(p[1]); }
  function duree(l) { return l.chantier && l.fin ? Math.max(0, min(l.fin) - min(l.debut) - (Number(l.pause) || 0)) : 0; }
  function total(lignes) { return lignes.reduce(function (s, l) { return s + duree(l); }, 0); }
  function fh(m) { var h = Math.floor(Math.abs(m) / 60), r = Math.abs(m) % 60; return h + 'h' + (r < 10 ? '0' : '') + r; }
  function hCourt(m) { var r = m % 60; return Math.floor(m / 60) + 'h' + (r ? (r < 10 ? '0' : '') + r : ''); }
  function fEcart(m) { return (m < 0 ? '−' : m > 0 ? '+' : '') + fh(m); }
  function heure(h) { return h ? h.replace(':', 'h') : ''; }
  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  var app = document.getElementById('app');

  var minuteurToast = null;
  function toast(txt) {
    var t = document.getElementById('toast');
    t.textContent = txt; t.style.display = 'block';
    clearTimeout(minuteurToast); minuteurToast = setTimeout(function () { t.style.display = 'none'; }, 4000);
  }
  function erreurPage(txt) { app.innerHTML = '<div class="message erreur">' + esc(txt) + '</div>'; }

  function parJour(lignes) {
    var m = {};
    lignes.forEach(function (l) { var k = l.salarie + '|' + l.date; (m[k] = m[k] || []).push(l); });
    Object.keys(m).forEach(function (k) { m[k].sort(function (a, b) { return String(a.debut).localeCompare(String(b.debut)); }); });
    return m;
  }

  /** Texte d'une journée (prévu ou réel), identique pour le salarié et les responsables. */
  /** sansRemarque : pour le prévu, les consignes ne s'affichent pas dans la carte (on les ouvre à part). */
  function htmlLignes(lignes, chantiers, avecAdresse, sansRemarque) {
    if (!lignes || !lignes.length) return '';
    return lignes.map(function (l) {
      if (!l.chantier) return '<div class="creneau"><span class="ch">' + esc(l.remarque || 'Absent') + '</span></div>';
      var c = chantiers[l.chantier];
      var nom = c ? c.nom : (l.chantierNom || 'Chantier');

      return '<div class="creneau"><div class="ch">' + esc(nom) + '</div>'
        + (avecAdresse && c && c.adresse ? '<div class="adr">' + esc(c.adresse) + '</div>' : '')
        + '<div class="h">' + heure(l.debut) + ' → ' + (l.fin ? heure(l.fin) : '<i>fin à saisir</i>') + '</div>'
        + '<div class="h">' + (l.pause ? 'pause ' + fh(l.pause) + (l.fin ? ' · ' : '') : '') + (l.fin ? '<b>' + fh(duree(l)) + '</b>' : '') + '</div>'
        + (l.remarque && !sansRemarque ? '<div class="comm">' + esc(l.remarque) + '</div>' : '') + '</div>';
    }).join('');
  }

  // ------------------------------------------------------------------------------------------
  // Données chargées d'avance et envois en arrière-plan (salarié et responsables)
  // ------------------------------------------------------------------------------------------
  // Chaque vue garde en mémoire environ trois mois (per.du → per.au). Changer de semaine à
  // l'intérieur ne demande rien à Google ; près du bord, la suite se charge sans faire attendre.
  function naviguer(per, lundi, action, dessiner) {
    var demande = { du: plusJours(lundi, -56), au: plusJours(lundi, 62) };
    if (lundi >= per.du && plusJours(lundi, 6) <= per.au) {
      dessiner();
      if (plusJours(lundi, -14) < per.du || plusJours(lundi, 20) > per.au) {
        api(action, demande).then(function (r) { fusionner(per, r); dessiner(); }, function () { /* on réessaiera au prochain clic */ });
      }
      return;
    }
    app.innerHTML = '<div class="chargement">Chargement…</div>';
    api(action, demande).then(function (r) { fusionner(per, r); dessiner(); })
      .catch(function (e) { erreurPage(e.message); });
  }

  function fusionner(per, r, sansConfirmes) {
    var disjoint = r.du > plusJours(per.au, 1) || r.au < plusJours(per.du, -1);
    var garder = function (x) { return !disjoint && (x.date < r.du || x.date > r.au); };
    per.prevu = per.prevu.filter(garder).concat(r.prevu);
    per.reel = per.reel.filter(garder).concat(r.reel);
    per.du = disjoint || r.du < per.du ? r.du : per.du;
    per.au = disjoint || r.au > per.au ? r.au : per.au;
    if (r.aujourdhui) per.aujourdhui = r.aujourdhui;
    if (r.limite) per.limite = r.limite;
    // Ce qui a été saisi pendant la session reste affiché tel que saisi
    // (sauf au rafraîchissement : Google a déjà ce qui est confirmé, et une saisie plus récente doit l'emporter)
    Object.keys(ENVOIS).forEach(function (k) {
      if (sansConfirmes && ENVOIS[k].etat === 'ok') return;
      var x = k.split('|');
      appliquerLocal(per[x[0]], x[1], [x[2]], ENVOIS[k].lignes);
    });
  }

  /** Ce qui a été saisi pendant la session reste affiché tel que saisi, même quand les données sont rechargées. */
  function reappliquerEnvois(per) {
    Object.keys(ENVOIS).forEach(function (k) {
      var x = k.split('|');
      if (per[x[0]]) appliquerLocal(per[x[0]], x[1], [x[2]], ENVOIS[k].lignes);
    });
  }

  function appliquerLocal(liste, sal, dates, lignes) {
    for (var i = liste.length - 1; i >= 0; i--) {
      if (liste[i].salarie === sal && dates.indexOf(liste[i].date) >= 0) liste.splice(i, 1);
    }
    dates.forEach(function (date) {
      lignes.forEach(function (l) {
        liste.push(l.chantier
          ? { date: date, salarie: sal, chantier: l.chantier, chantierNom: '', debut: l.debut, fin: l.fin, pause: Number(l.pause) || 0, remarque: l.remarque || '', travail: l.travail || '' }
          : { date: date, salarie: sal, chantier: '', chantierNom: '', debut: '', fin: '', pause: 0, remarque: l.remarque || 'Absent' });
      });
    });
  }

  // 'type|salarié|date' → { etat: 'envoi' | 'ok' | 'erreur', lignes, message }
  var ENVOIS = {};
  var fileEnvois = Promise.resolve();
  var envoisEnCours = 0;

  function etatEnvoi(type, sal, date) {
    var e = ENVOIS[type + '|' + sal + '|' + date];
    return e && e.etat !== 'ok' ? e.etat : '';
  }

  /**
   * La saisie s'affiche tout de suite, l'envoi part derrière. Tant que Google n'a pas confirmé,
   * la journée porte « Envoi… » ; en cas d'échec, « Non enregistré » en rose, avec de quoi réessayer.
   */
  function envoyer(o) {
    var sals = o.sals || [o.sal];
    var cles = [];
    sals.forEach(function (sal) {
      o.dates.forEach(function (dt) { cles.push(o.type + '|' + sal + '|' + dt); });
      appliquerLocal(o.per[o.type], sal, o.dates, o.lignes);
    });
    cles.forEach(function (k) { ENVOIS[k] = { etat: 'envoi', lignes: o.lignes }; });
    envoisEnCours++;
    o.redessiner();
    fileEnvois = fileEnvois.then(function () {
      return api(o.action, o.donnees).then(function (rep) {
        envoisEnCours--;
        cles.forEach(function (k) { if (ENVOIS[k].lignes === o.lignes) ENVOIS[k].etat = 'ok'; });
        if (o.apres) o.apres(rep);
        o.redessiner();
        toast('Enregistré ✓');
      }, function (err) {
        envoisEnCours--;
        cles.forEach(function (k) { if (ENVOIS[k].lignes === o.lignes) { ENVOIS[k].etat = 'erreur'; ENVOIS[k].message = err.message; } });
        o.redessiner();
        toast('Non enregistré : ' + err.message);
      });
    });
  }

  /** Les mêmes contrôles que Google, faits avant d'envoyer : un refus ne doit pas arriver après coup. */
  function valider(lignes) {
    // Créneaux de chantier et absences d'une demi-journée (qui ont des heures) ne doivent pas se chevaucher
    var tri = lignes.filter(function (l) { return l.debut; }).slice().sort(function (a, b) { return min(a.debut) - min(b.debut); });
    for (var i = 0; i < tri.length; i++) {
      if (i && min(tri[i].debut) < min(tri[i - 1].fin)) return 'Deux créneaux se chevauchent : ' + tri[i - 1].debut + '–' + tri[i - 1].fin + ' et ' + tri[i].debut + '–' + tri[i].fin + '.';
      // Créneau encore ouvert (fin vide) : permis seulement en dernier
      if (!tri[i].fin) { if (i < tri.length - 1) return 'Il manque l\'heure de fin du créneau de ' + heure(tri[i].debut) + ' : mets-la avant d\'en ajouter un autre.'; continue; }
      var dur = min(tri[i].fin) - min(tri[i].debut);
      if (dur <= 0) return 'L\'heure de fin doit être après l\'heure de début.';
      if (tri[i].chantier && (Number(tri[i].pause) || 0) >= dur) return 'La pause est plus longue que le créneau.';
    }
    return '';
  }

  // ------------------------------------------------------------------------------------------
  // Fenêtre de saisie d'une journée (salarié et responsables)
  // ------------------------------------------------------------------------------------------
  /**
   * o = { titre, date, lignes, chantiers (liste), libelleAbsence, joursSupp (dates proposées), autresSalaries,
   *       peutEffacer, enregistrer(lignes, joursCoches, salariesCoches),
   *       et pour la saisie du salarié par demi-journée : ligneDefaut, chantierPrevu, absenceHoraire,
   *       infoHaut (texte déjà mis en page), libelleRemarque, libelleOk, libelleEffacer, verifier(lignes) }
   */
  function fenetreJour(o) {
    var actifs = o.chantiers.filter(function (c) { return c.actif; });
    var lignes = (o.lignes || []).map(function (l) { return Object.assign({}, l); });
    var absent = lignes.length === 1 && !lignes[0].chantier;
    var motif = absent ? lignes[0].remarque : '';
    if (absent || !lignes.length) lignes = [ligneVide(null)];

    function ligneVide(avant) {
      if (o.ligneDefaut) return avant ? { chantier: '', debut: '', fin: '', pause: 0, remarque: '' } : Object.assign({}, o.ligneDefaut);
      return avant ? { chantier: '', debut: avant.fin, fin: '', pause: 0, remarque: '' }
        : { chantier: '', debut: '08:00', fin: '17:00', pause: 60, remarque: '' };
    }
    var nomPrevu = '';
    if (o.chantierPrevu) o.chantiers.forEach(function (c) { if (c.id === o.chantierPrevu) nomPrevu = c.nom; });

    var voile = el('<div class="voile"></div>');
    var f = el('<div class="fenetre"></div>');
    voile.appendChild(f);
    document.body.appendChild(voile);
    document.body.style.overflow = 'hidden';
    function fermer() { voile.remove(); document.body.style.overflow = ''; }

    function optionsChantier(sel) {
      var liste = actifs.slice();
      if (sel && !actifs.some(function (c) { return c.id === sel; })) {
        var ancien = o.chantiers.filter(function (c) { return c.id === sel; })[0];
        if (ancien) liste.unshift(ancien);
      }
      return '<option value="">— Choisir le chantier —</option>' + liste.map(function (c) {
        return '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.nom) + '</option>';
      }).join('');
    }
    function optionsPause(p) {
      var liste = PAUSES.indexOf(Number(p)) >= 0 ? PAUSES : PAUSES.concat([Number(p)]).sort(function (a, b) { return a - b; });
      return liste.map(function (v) { return '<option value="' + v + '"' + (v === Number(p) ? ' selected' : '') + '>' + (v ? fh(v) : '0') + '</option>'; }).join('');
    }

    function dessiner(message) {
      var h = '<h2>' + esc(o.titre) + '</h2><div class="sous">' + esc(jourLong(o.date)) + '</div>' + (o.infoHaut || '');
      h += '<label class="case-a-cocher"><input type="checkbox" data-absent' + (absent ? ' checked' : '') + '> ' + esc(o.libelleAbsence) + '</label>';
      if (absent) {
        h += '<label class="champ"><span>Motif</span><input type="text" data-motif maxlength="120" placeholder="Congé, maladie, formation…" value="' + esc(motif) + '"></label>';
      } else {
        lignes.forEach(function (l, i) {
          h += '<div class="ligne-saisie" data-i="' + i + '">'
            + (o.chantierPrevu && i === 0
              // Salarié : « chantier prévu » ou « autre chantier », la liste n'apparaît que pour un autre chantier
              ? '<div class="choix-chantier">'
                + '<label class="case-a-cocher"><input type="radio" name="choix' + i + '" data-choix="prevu" data-ligne="' + i + '"' + (l.chantier === o.chantierPrevu && !l.autre ? ' checked' : '') + '> Chantier prévu : <b>' + esc(nomPrevu) + '</b></label>'
                + '<label class="case-a-cocher"><input type="radio" name="choix' + i + '" data-choix="autre" data-ligne="' + i + '"' + (l.chantier === o.chantierPrevu && !l.autre ? '' : ' checked') + '> J\'ai travaillé sur un autre chantier</label>'
                + (l.chantier === o.chantierPrevu && !l.autre ? '' : '<label class="champ"><span>Chantier</span><select data-k="chantier">' + optionsChantier(l.chantier === o.chantierPrevu ? '' : l.chantier) + '</select></label>')
                + '</div>'
              : '<label class="champ"><span>Chantier' + (lignes.length > 1 ? ' ' + (i + 1) : '') + '</span><select data-k="chantier">' + optionsChantier(l.chantier) + '</select></label>')
            + '<div class="trio">'
            + '<label class="champ"><span>Début</span><input type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="--:--" data-k="debut" data-heure value="' + esc(l.debut) + '"></label>'
            + '<label class="champ"><span>Fin</span><input type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="--:--" data-k="fin" data-heure value="' + esc(l.fin) + '"></label>'
            + '<label class="champ"><span>Pause</span><select data-k="pause">' + optionsPause(l.pause) + '</select></label>'
            + '</div>'
            + '<div class="aide-heure">Tapez l\'heure au clavier : 0830 ou 830 pour 8h30, 17 pour 17h00.</div>'
            + '<div class="duree" data-duree></div>'
            + '<label class="champ" style="margin-top:10px"><span>' + esc(o.libelleRemarque || 'Remarque (facultatif)') + '</span><textarea data-k="remarque" rows="3" maxlength="2000">' + esc(l.remarque) + '</textarea></label>'
            + (lignes.length > 1 ? '<button type="button" class="lien-btn" data-retirer="' + i + '">Retirer ce chantier</button>' : '')
            + '</div>';
        });
        h += '<button type="button" class="btn second plein" data-ajouter>' + (o.ligneDefaut ? '+ Un autre créneau' : '+ Un autre chantier ce jour-là') + '</button>';
      }
      if (o.joursSupp && o.joursSupp.length) {
        h += '<div class="bloc" style="margin-top:14px"><div class="bloc-titre">Appliquer aussi à</div><div class="jours-supp">'
          + o.joursSupp.map(function (j) { return '<label class="case-a-cocher"><input type="checkbox" data-jour="' + j + '"' + (joursCoches[j] ? ' checked' : '') + '> ' + esc(jourCourt(j)) + '</label>'; }).join('')
          + '</div></div>';
      }
      if (o.autresSalaries && o.autresSalaries.length) {
        h += '<div class="bloc" style="margin-top:6px"><div class="bloc-titre">Et à ces salariés (leur planning de ces jours sera remplacé)</div><div class="jours-supp">'
          + o.autresSalaries.map(function (x) { return '<label class="case-a-cocher"><input type="checkbox" data-sal="' + esc(x.id) + '"' + (salCoches[x.id] ? ' checked' : '') + '> ' + esc(x.nom) + '</label>'; }).join('')
          + '</div></div>';
      }
      if (message) h += '<div class="erreur-saisie">' + esc(message) + '</div>';
      h += '<div class="pied"><button type="button" class="btn second" data-annuler>Annuler</button><button type="button" class="btn" data-ok>' + esc(o.libelleOk || 'Enregistrer') + '</button></div>';
      if (o.peutEffacer) h += '<div style="text-align:center;margin-top:6px"><button type="button" class="lien-btn" data-effacer>' + esc(o.libelleEffacer || 'Effacer cette journée') + '</button></div>';
      f.innerHTML = h;
      majDurees();
    }

    var joursCoches = {}, salCoches = {};
    function lireCoches() {
      f.querySelectorAll('[data-jour]').forEach(function (c) { joursCoches[c.getAttribute('data-jour')] = c.checked; });
      f.querySelectorAll('[data-sal]').forEach(function (c) { salCoches[c.getAttribute('data-sal')] = c.checked; });
    }
    function lireChamps() {
      lireCoches();
      if (absent) { var m = f.querySelector('[data-motif]'); motif = m ? m.value : motif; return; }
      f.querySelectorAll('.ligne-saisie').forEach(function (bloc) {
        var l = lignes[Number(bloc.getAttribute('data-i'))];
        bloc.querySelectorAll('[data-k]').forEach(function (c) {
          var k = c.getAttribute('data-k');
          l[k] = k === 'pause' ? Number(c.value) : c.hasAttribute('data-heure') ? (lireHeure(c.value) || c.value.trim()) : c.value;
        });
      });
    }
    function majDurees() {
      f.querySelectorAll('.ligne-saisie').forEach(function (bloc) {
        var l = lignes[Number(bloc.getAttribute('data-i'))];
        var ok = /^\d\d:\d\d$/.test(l.debut) && /^\d\d:\d\d$/.test(l.fin) && min(l.fin) > min(l.debut);
        bloc.querySelector('[data-duree]').textContent = ok ? 'Temps de travail : ' + fh(Math.max(0, min(l.fin) - min(l.debut) - l.pause)) : '';
      });
    }

    f.addEventListener('input', function () { lireChamps(); majDurees(); });
    // En touchant un champ d'heure, tout est sélectionné : on tape la nouvelle heure directement
    f.addEventListener('focusin', function (e) {
      if (e.target.hasAttribute && e.target.hasAttribute('data-heure')) setTimeout(function () { e.target.select(); }, 0);
    });
    // En quittant un champ d'heure, « 830 » devient « 08:30 »
    f.addEventListener('focusout', function (e) {
      if (!e.target.hasAttribute || !e.target.hasAttribute('data-heure')) return;
      var h = lireHeure(e.target.value);
      if (h) e.target.value = h;
    });
    f.addEventListener('change', function (e) {
      if (e.target.hasAttribute('data-absent')) { lireChamps(); absent = e.target.checked; dessiner(); return; }
      if (e.target.hasAttribute('data-choix')) {
        lireChamps();
        var lc = lignes[Number(e.target.getAttribute('data-ligne'))];
        if (e.target.getAttribute('data-choix') === 'prevu') { lc.chantier = o.chantierPrevu; lc.autre = false; }
        else { lc.chantier = ''; lc.autre = true; }
        dessiner();
        return;
      }
      lireChamps(); majDurees();
    });
    f.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.hasAttribute('data-annuler')) { fermer(); return; }
      if (b.hasAttribute('data-corriger-reel') && o.corrigerReel) { fermer(); o.corrigerReel(); return; }
      if (b.hasAttribute('data-ajouter')) { lireChamps(); lignes.push(ligneVide(lignes[lignes.length - 1])); dessiner(); return; }
      if (b.hasAttribute('data-retirer')) { lireChamps(); lignes.splice(Number(b.getAttribute('data-retirer')), 1); dessiner(); return; }
      if (b.hasAttribute('data-effacer')) { validerEtFermer([]); return; }
      if (b.hasAttribute('data-ok')) {
        lireChamps();
        var a_envoyer;
        if (absent) {
          a_envoyer = [{ chantier: '', remarque: motif.trim() || 'Absent' }];
          if (o.absenceHoraire) { a_envoyer[0].debut = o.absenceHoraire.debut; a_envoyer[0].fin = o.absenceHoraire.fin; }
        }
        else {
          if (lignes.some(function (l) { return !l.chantier; })) { dessiner('Choisissez le chantier.'); return; }
          if (lignes.some(function (l) { return !l.debut || !l.fin; })) { dessiner('Indiquez l\'heure de début et de fin.'); return; }
          if (lignes.some(function (l) { return !/^\d\d:\d\d$/.test(l.debut) || !/^\d\d:\d\d$/.test(l.fin); })) {
            dessiner('Heure illisible : tapez par exemple 0830 pour 8h30.'); return;
          }
          a_envoyer = lignes.map(function (l) { return { chantier: l.chantier, debut: l.debut, fin: l.fin, pause: l.pause, remarque: l.remarque, travail: l.travail || '' }; });
          var probleme = valider(a_envoyer);
          if (probleme) { dessiner(probleme); return; }
        }
        if (o.verifier) { var pb = o.verifier(a_envoyer); if (pb) { dessiner(pb); return; } }
        validerEtFermer(a_envoyer);
      }
    });

    function validerEtFermer(liste) {
      var coches = Array.prototype.map.call(f.querySelectorAll('[data-jour]:checked'), function (c) { return c.getAttribute('data-jour'); });
      var sals = Array.prototype.map.call(f.querySelectorAll('[data-sal]:checked'), function (c) { return c.getAttribute('data-sal'); });
      fermer();
      o.enregistrer(liste, coches, sals);
    }

    dessiner();
  }

  // ------------------------------------------------------------------------------------------
  // Vue du salarié
  // ------------------------------------------------------------------------------------------
  var S = null;            // données chargées : { id, nom, aujourdhui, limite, chantiers, collegues, du, au, prevu, reel, travaux }
  var lundiAffiche = null;
  var ongletS = 'planning'; // 'planning' | 'travaux' | 'heures'

  function salarie(r) {
    document.getElementById('quoi').textContent = 'Planning';
    document.getElementById('qui').textContent = r.nom;
    app.classList.add('etroit');
    var premier = !S;
    S = r;
    reappliquerEnvois(S);
    if (premier || !lundiAffiche) lundiAffiche = lundiDe(r.aujourdhui);
    if (lundiAffiche < S.du || plusJours(lundiAffiche, 6) > S.au) { naviguer(S, lundiAffiche, 'moi.semaine', dessinerSalarie); return; }
    dessinerSalarie();
  }

  var MOIS_LONGS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  function dateLongue(s) { var x = d(s); return maj(JOURS[x.getUTCDay()]) + ' ' + x.getUTCDate() + ' ' + MOIS_LONGS[x.getUTCMonth()]; }
  function chantiersS() { var m = {}; S.chantiers.forEach(function (c) { m[c.id] = c; }); return m; }
  function nomChantier(id, chantiers, secours) { return chantiers[id] ? chantiers[id].nom : (secours || 'Chantier'); }
  function lundiDe(s) { var j = d(s).getUTCDay(); return plusJours(s, j === 0 ? -6 : 1 - j); }
  function ouvert(l) { return !!(l.chantier && l.debut && !l.fin); } // arrivée pointée, fin pas encore mise
  function passeMidi(l) { return l.chantier && l.debut && min(l.debut) < 12 * 60 && min(l.fin) > 12 * 60; }
  function travauxOuverts() { return (S.travaux || []).filter(function (t) { return t.statut !== 'fait'; }); }
  function travailParId(id) { return (S.travaux || []).filter(function (t) { return t.id === id; })[0]; }
  function tempsPar(t) { return Object.keys(t.par || {}).map(function (n) { return n + ' ' + hCourt(t.par[n]); }).join(', '); }

  /** Les chantiers d'une journée dans l'ordre : de la première heure à la dernière, et leurs consignes (une par ligne). */
  function chantiersDuJour(lignes) {
    var res = [], parId = {};
    lignes.filter(function (l) { return l.chantier; })
      .sort(function (a, b) { return min(a.debut) - min(b.debut); })
      .forEach(function (l) {
        var x = parId[l.chantier];
        if (!x) { x = parId[l.chantier] = { id: l.chantier, nom: l.chantierNom, debut: l.debut, fin: l.fin, consignes: [] }; res.push(x); }
        if (min(l.debut) < min(x.debut)) x.debut = l.debut;
        if (min(l.fin) > min(x.fin)) x.fin = l.fin;
        String(l.remarque || '').split('\n').forEach(function (c) { c = c.trim(); if (c && x.consignes.indexOf(c) < 0) x.consignes.push(c); });
      });
    return res;
  }

  /** Une demi-journée prévue sur un chantier attend des heures ; une absence prévue, non. */
  function journeeSaisie(p, r) {
    var attendus = [true, false].filter(function (m) { return pourMoment(p, m).some(function (l) { return l.chantier; }); });
    return attendus.length ? attendus.every(function (m) { return pourMoment(r, m).length; }) : r.length > 0;
  }

  // ------------------------------------------------------------------ onglets du salarié
  function dessinerSalarie() {
    var n = travauxOuverts().length;
    var h = '<div class="onglets-s">' + [['planning', 'Mon planning'], ['travaux', 'Travaux' + (n ? ' <span class="nb">' + n + '</span>' : '')], ['heures', 'Mes heures']].map(function (o) {
      return '<button type="button" class="onglet-s' + (ongletS === o[0] ? ' actif' : '') + '" data-onglet-s="' + o[0] + '">' + o[1] + '</button>';
    }).join('') + '</div>';
    if (ongletS === 'travaux') h += htmlTravauxS();
    else if (ongletS === 'heures') h += htmlMesHeures();
    else h += htmlPlanningS();
    app.innerHTML = h;
  }

  // ------------------------------------------------------------------ onglet « Mon planning »
  function htmlPlanningS() {
    var chantiers = chantiersS();
    var pr = parJour(S.prevu), re = parJour(S.reel);
    var h = '<div class="bonjour">Bonjour ' + esc(String(S.nom || '').split(' ')[0]) + '</div><div class="astuce">Touche un jour du tableau pour l\'ouvrir.</div>';
    h += '<div class="semaine-nav"><button type="button" class="btn second" data-sem="-7" aria-label="Semaine précédente">◀</button>'
      + '<div class="titre">' + esc(titreSemaine(lundiAffiche)) + '</div>'
      + '<button type="button" class="btn second" data-sem="7" aria-label="Semaine suivante">▶</button></div>';
    if (lundiAffiche !== lundiDe(S.aujourdhui)) h += '<div style="text-align:center;margin:-6px 0 10px"><button type="button" class="lien-btn" data-sem="0">Revenir à cette semaine</button></div>';
    h += htmlApercu(pr, re, chantiers);
    h += htmlCarteJour(S.aujourdhui, pr, re, chantiers);
    var venir = '';
    for (var i = 1; i <= 7; i++) {
      var dt = plusJours(S.aujourdhui, i);
      if (dt > S.au) break;
      var p = pr[S.id + '|' + dt] || [];
      if (d(dt).getUTCDay() === 0 && !p.length) continue;
      venir += htmlLigneJour(dt, p, chantiers);
    }
    if (venir) h += '<div class="titre-section">À venir</div>' + venir;
    return h;
  }

  /** Un jour à venir sur une ligne : chantiers et horaires ; un appui l'ouvre. */
  function htmlLigneJour(date, p, chantiers) {
    var x = d(date), lignes = [];
    [true, false].forEach(function (m) {
      pourMoment(p, m).forEach(function (l) {
        var t = l.chantier ? '<b>' + esc(nomChantier(l.chantier, chantiers, l.chantierNom)) + '</b> ' + hc(l.debut) + '–' + hc(l.fin) : '<b>' + esc(l.remarque || 'Absent') + '</b>';
        if (lignes.indexOf(t) < 0) lignes.push(t);
      });
    });
    return '<button type="button" class="mini" data-detail="' + date + '"><span class="mini-d">' + maj(JOURS[x.getUTCDay()].slice(0, 3)) + '.<small>' + x.getUTCDate() + ' ' + MOIS[x.getUTCMonth()] + '</small></span>'
      + '<span class="mini-c">' + (lignes.length ? lignes.join('<br>') : '<span class="vide">Rien de prévu</span>') + '</span><span class="chev">›</span></button>';
  }

  /** La carte du jour : matin et après-midi, prévu à gauche, mes heures à droite, un bouton par demi-journée. */
  function htmlCarteJour(date, pr, re, chantiers) {
    var p = pr[S.id + '|' + date] || [], r = re[S.id + '|' + date] || [];
    var auj = date === S.aujourdhui;
    var passe = date <= S.aujourdhui;
    var modifiable = passe && date >= S.limite;
    var ev = etatEnvoi('reel', S.id, date);
    var attendus = [true, false].filter(function (m) { return pourMoment(p, m).some(function (l) { return l.chantier; }); });
    var saisi = function (m) { return pourMoment(r, m).length > 0; };
    var complet = journeeSaisie(p, r);
    var faits = attendus.filter(saisi);

    var etiquette = '';
    if (ev === 'envoi') etiquette = '<span class="etiquette attente">Envoi…</span>';
    else if (ev === 'erreur') etiquette = '<span class="etiquette manque">Non enregistré</span>';
    else if (r.some(ouvert)) etiquette = '<span class="etiquette attente">Fin à saisir</span>';
    else if (r.length && complet) etiquette = '<span class="etiquette ok">Saisi</span>';
    else if (faits.length) {
      etiquette = '<span class="etiquette ' + (auj ? 'attente' : 'manque') + '">' + (faits[0] ? 'Matin saisi · après-midi ' : 'Après-midi saisi · matin ')
        + (auj ? 'à saisir' : 'manquant') + '</span>';
    }
    else if (auj) etiquette = '<span class="etiquette auj">Aujourd\'hui</span>';
    else if (passe && p.some(function (l) { return l.chantier; })) etiquette = '<span class="etiquette manque">Pas saisi</span>';

    var aConsignes = chantiersDuJour(p).some(function (x) { return x.consignes.length; });
    var h = '<div class="jour' + (auj ? ' aujourdhui' : '') + '" id="jour-' + date + '">'
      + '<button type="button" class="jour-tete bouton-jour" data-detail="' + date + '" aria-label="Voir le détail du ' + esc(jourLong(date)) + '">'
      + '<span class="jour-nom">' + esc(jourLong(date)) + (auj ? ' · aujourd\'hui' : '') + '</span>'
      + '<span class="jour-droite">' + etiquette + '<span class="voir">' + (aConsignes ? 'Consignes' : 'Détail') + ' ›</span></span></button>';
    // Un jour encore modifiable montre toujours le matin et l'après-midi : on peut saisir même sans prévu
    var moments = modifiable ? [true, false] : [true, false].filter(function (m) { return pourMoment(p, m).length || pourMoment(r, m).length; });
    if (!moments.length) h += '<div class="vide">Rien de prévu</div>';
    var momentLibre = false;
    moments.forEach(function (m) {
      var gp = pourMoment(p, m), gr = pourMoment(r, m);
      if (!gp.some(function (l) { return l.chantier; }) && !gr.length) momentLibre = true;
      h += '<div class="moment-jour"><div class="bloc-titre">' + (m ? 'Matin' : 'Après-midi') + '</div>';
      var colP = gp.length ? htmlLignes(gp, chantiers, true, true) : '<div class="vide">Rien de prévu</div>';
      if (passe) {
        var attenduIci = gp.some(function (l) { return l.chantier; }) || !p.length;
        var colR = gr.length ? htmlLignes(gr, chantiers, false) : '<div class="asaisir">' + (modifiable && attenduIci ? 'à saisir' : '—') + '</div>';
        h += '<div class="deux-col"><div><div class="k">Prévu</div>' + colP + '</div><div class="r"><div class="k">Mes heures</div>' + colR + '</div></div>';
      } else {
        h += colP;
      }
      if (modifiable) {
        var nomM = m ? 'le matin' : 'l\'après-midi';
        h += '<div class="actions-jour"><button type="button" class="btn ' + (gr.length ? 'second ' : '') + 'plein" data-moment="' + date + '|' + (m ? 'm' : 'a') + '">'
          + (gr.some(ouvert) ? 'Mettre l\'heure de fin' : (gr.length ? 'Corriger ' : 'Saisir ') + nomM) + '</button></div>';
      }
      h += '</div>';
    });
    if (auj && modifiable && momentLibre && travauxOuverts().length) {
      h += '<div class="incite">Rien de prévu sur une demi-journée : dans la saisie, tu pourras cocher les travaux en attente que tu as faits.</div>';
    }
    if (ev === 'erreur') {
      h += '<div class="message erreur" style="margin:10px 0 0">Ces heures ne sont pas arrivées au bureau : ' + esc(ENVOIS['reel|' + S.id + '|' + date].message) + '</div>'
        + '<div class="actions-jour"><button type="button" class="btn plein" data-renvoyer="' + date + '">Réessayer l\'envoi</button></div>';
    }
    if (passe && !modifiable && !complet && p.some(function (l) { return l.chantier; })) {
      h += '<div class="verrou">Jour trop ancien pour être saisi ici : voyez avec le bureau.</div>';
    }
    return h + '</div>';
  }

  /**
   * Tableau de la semaine : un jour par colonne, matin et après-midi en lignes, le chantier prévu dans chaque case.
   * Une journée 8h–17h apparaît matin et après-midi. Toucher une case ouvre le jour.
   */
  function htmlApercu(pr, re, chantiers) {
    var jours = [];
    for (var i = 0; i < 7; i++) {
      var dt = plusJours(lundiAffiche, i);
      if (i < 6 || pr[S.id + '|' + dt]) jours.push(dt);
    }
    var LETTRES = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
    var texte = function (lignes) {
      var noms = [];
      lignes.forEach(function (l) {
        var n = l.chantier ? nomChantier(l.chantier, chantiers, l.chantierNom) : (l.remarque || 'Absent');
        if (noms.indexOf(n) < 0) noms.push(n);
      });
      return noms.length ? noms.map(esc).join('<br>') : '<span class="vide">·</span>';
    };
    var h = '<table class="apercu"><thead><tr><th></th>' + jours.map(function (dt) {
      return '<th class="' + (dt === S.aujourdhui ? 'auj' : '') + '">' + LETTRES[d(dt).getUTCDay()] + '<span>' + d(dt).getUTCDate() + '</span></th>';
    }).join('') + '</tr></thead><tbody>';
    [['Matin', auMatin], ['Aprèm', aLApresMidi]].forEach(function (moment) {
      h += '<tr><th class="moment">' + moment[0] + '</th>' + jours.map(function (dt) {
        // Dès que la demi-journée est saisie, c'est le réel qu'on montre, sur fond bleu (comme l'onglet Planning du bureau)
        var faites = (re[S.id + '|' + dt] || []).filter(moment[1]);
        var lignes = faites.length ? faites : (pr[S.id + '|' + dt] || []).filter(moment[1]);
        return '<td><button type="button" class="ap-case' + (dt === S.aujourdhui ? ' auj' : '') + (faites.length ? ' reel' : '') + '" data-detail="' + dt + '" aria-label="Ouvrir le ' + esc(jourLong(dt)) + '">' + texte(lignes) + '</button></td>';
      }).join('') + '</tr>';
    });
    // Heures prévues de la journée ; un jour passé pas encore saisi porte « à saisir »
    h += '<tr><th class="moment">Heures</th>' + jours.map(function (dt) {
      var p = pr[S.id + '|' + dt] || [], r = re[S.id + '|' + dt] || [];
      var aSaisir = dt < S.aujourdhui && p.some(function (l) { return l.chantier; }) && !journeeSaisie(p, r);
      // Heures saisies dès qu'il y en a ; sinon les heures prévues
      var tp = r.length ? total(r) : total(p);
      var t = aSaisir ? 'à saisir' : (r.some(ouvert) ? 'en cours' : (tp ? hCourt(tp) : '<span class="vide">·</span>'));
      return '<td><button type="button" class="ap-case heures' + (dt === S.aujourdhui ? ' auj' : '') + (aSaisir ? ' asais' : '') + (r.length && !aSaisir ? ' reel' : '') + '" data-detail="' + dt + '" aria-label="Ouvrir le ' + esc(jourLong(dt)) + '">' + t + '</button></td>';
    }).join('') + '</tr>';
    return h + '</tbody></table>';
  }

  /** Une fenêtre simple (détail, travail, ajout) : le contenu est fourni tout fait. */
  function fenetreSimple(html, surClic) {
    var voile = el('<div class="voile"></div>');
    var f = el('<div class="fenetre"></div>');
    f.innerHTML = html;
    voile.appendChild(f);
    document.body.appendChild(voile);
    document.body.style.overflow = 'hidden';
    var fermer = function () { voile.remove(); document.body.style.overflow = ''; };
    f.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.hasAttribute('data-fermer')) { fermer(); return; }
      if (surClic) surClic(b, fermer, f);
    });
    return { f: f, fermer: fermer };
  }

  /** Le détail d'un jour : chantiers (adresse, horaires, collègues, consignes), mes heures, et les boutons de saisie. */
  function ouvrirDetail(date) {
    var chantiers = chantiersS();
    var p = parJour(S.prevu)[S.id + '|' + date] || [];
    var r = parJour(S.reel)[S.id + '|' + date] || [];
    var modifiable = date <= S.aujourdhui && date >= S.limite;
    var h = '<h2>' + esc(dateLongue(date)) + '</h2><div class="sous">Détail de la journée</div>';
    var liste = chantiersDuJour(p);
    var absence = p.filter(function (l) { return !l.chantier; })[0];
    if (!liste.length) h += '<div class="det-chantier"><div class="vide">' + esc(absence ? (absence.remarque || 'Absent') : 'Rien de prévu ce jour-là') + '</div></div>';
    liste.forEach(function (x) {
      var c = chantiers[x.id];
      var col = (S.collegues || {})[date + '|' + x.id];
      h += '<div class="det-chantier"><div class="ch">' + esc(c ? c.nom : x.nom) + '</div>'
        + (c && c.adresse ? '<div class="adr">' + esc(c.adresse) + '</div>' : '')
        + '<div class="h">Prévu ' + heure(x.debut) + ' → ' + heure(x.fin) + ' · ' + (col && col.length ? 'avec ' + esc(col.join(', ')) : 'seul') + '</div>'
        + (x.consignes.length
          ? '<div class="bloc-titre" style="margin-top:8px">Consignes</div><div class="consignes-liste">' + x.consignes.map(function (t) { return '<div class="l">' + esc(t) + '</div>'; }).join('') + '</div>'
          : '<div class="vide" style="margin-top:6px">Pas de consigne</div>')
        + '</div>';
    });
    if (r.length) {
      h += '<div class="bloc-titre" style="margin-top:12px">Mes heures</div>' + r.slice().sort(function (a, b) { return String(a.debut).localeCompare(String(b.debut)); }).map(function (l) {
        var t = l.travail ? travailParId(l.travail) : null;
        var nom = l.chantier ? (t ? t.texte + ' (' + nomChantier(l.chantier, chantiers, l.chantierNom) + ')' : nomChantier(l.chantier, chantiers, l.chantierNom)) : (l.remarque || 'Absent');
        return '<div class="comm-lecture"><b>' + esc(nom) + '</b>'
          + (l.chantier ? heure(l.debut) + ' → ' + (l.fin ? heure(l.fin) + (l.pause ? ', pause ' + fh(l.pause) : '') + ' = ' + fh(duree(l)) : 'fin à saisir') : '')
          + (l.chantier && l.remarque ? '<div class="comm">' + esc(l.remarque) + '</div>' : '') + '</div>';
      }).join('');
    }
    if (modifiable) {
      var re = r;
      h += '<div class="pied">' + [true, false].map(function (m) {
        var fait = pourMoment(re, m).length > 0;
        return '<button type="button" class="btn ' + (fait ? 'second' : '') + '" data-moment="' + date + '|' + (m ? 'm' : 'a') + '">' + (fait ? 'Corriger ' : 'Saisir ') + (m ? 'le matin' : 'l\'après-midi') + '</button>';
      }).join('') + '</div>';
    }
    h += '<div class="pied"><button type="button" class="btn second" data-fermer>Fermer</button></div>';
    fenetreSimple(h, function (b, fermer) {
      if (b.hasAttribute('data-moment')) { fermer(); var x = b.getAttribute('data-moment').split('|'); saisirMoment(x[0], x[1] === 'm'); }
    });
  }

  // ------------------------------------------------------------------ saisie d'une demi-journée
  /**
   * Heures vides à taper, prévu rappelé au-dessus ; les travaux en attente sont repliés et se cochent si besoin.
   * L'autre demi-journée n'est pas touchée.
   */
  function saisirMoment(date, matin) {
    var p = parJour(S.prevu)[S.id + '|' + date] || [];
    var r = parJour(S.reel)[S.id + '|' + date] || [];
    if (r.some(passeMidi)) { saisirJournee(date); return; } // saisie ancienne d'un seul bloc : on la corrige en entier
    var chantiers = chantiersS();
    var dansCeMoment = function (l) { return !l.debut || (min(l.debut) < 12 * 60) === matin; };
    var ceMoment = r.filter(dansCeMoment);
    var autres = r.filter(function (l) { return !dansCeMoment(l); });
    var gp = pourMoment(p, matin).filter(function (l) { return l.chantier; });
    var chantierPrevu = gp.length ? gp[0].chantier : '';
    var rappel = gp.length
      ? 'Prévu : ' + gp.map(function (l) { return nomChantier(l.chantier, chantiers, l.chantierNom) + ', ' + heure(l.debut) + ' → ' + heure(l.fin); }).join(' puis ')
      : 'Rien de prévu ' + (matin ? 'ce matin' : 'cet après-midi') + '.';
    var actifs = S.chantiers.filter(function (c) { return c.actif; });

    // État de la fenêtre
    var absenceLigne = ceMoment.filter(function (l) { return !l.chantier; })[0];
    var absent = !!absenceLigne, motif = absenceLigne ? absenceLigne.remarque : '';
    var creneaux = ceMoment.filter(function (l) { return l.chantier && !l.travail; }).map(function (l) { return { chantier: l.chantier, debut: l.debut, fin: l.fin, pause: Number(l.pause) || 0, autre: l.chantier !== chantierPrevu }; });
    if (!creneaux.length) creneaux = [{ chantier: chantierPrevu, debut: '', fin: '', pause: 0, autre: !chantierPrevu }];
    var faits = {}; // travail → { debut, fin, termine }
    ceMoment.filter(function (l) { return l.travail; }).forEach(function (l) {
      var t = travailParId(l.travail);
      faits[l.travail] = { debut: l.debut, fin: l.fin, termine: !!(t && t.statut === 'fait') };
    });
    var dejaFaits = Object.keys(faits);
    var commentaire = (ceMoment.filter(function (l) { return l.chantier && l.remarque; })[0] || {}).remarque || '';
    var deroule = dejaFaits.length > 0;
    var listeTravaux = (S.travaux || []).filter(function (t) { return t.statut !== 'fait' || faits[t.id]; });

    var fen = fenetreSimple('', function (b, fermer) {
      lire();
      if (b.hasAttribute('data-annuler')) { fermer(); return; }
      if (b.hasAttribute('data-ajouter')) { creneaux.push({ chantier: '', debut: '', fin: '', pause: 0, autre: true }); dessiner(); return; }
      if (b.hasAttribute('data-retirer')) { creneaux.splice(Number(b.getAttribute('data-retirer')), 1); dessiner(); return; }
      if (b.hasAttribute('data-deroule')) { deroule = !deroule; dessiner(); return; }
      if (b.hasAttribute('data-tfini')) { var x = b.getAttribute('data-tfini').split('|'); faits[x[0]].termine = x[1] === '1'; dessiner(); return; }
      if (b.hasAttribute('data-effacer')) {
        var etatsE = {};
        dejaFaits.forEach(function (id) { etatsE[id] = 'a_faire'; });
        fermer(); enregistrerSalarie(date, autres, etatsE); return;
      }
      if (b.hasAttribute('data-ok')) {
        var res = construire();
        if (res.erreur) { dessiner(res.erreur); return; }
        fermer();
        enregistrerSalarie(date, autres.concat(res.lignes), res.etats);
      }
    });
    var f = fen.f;

    function optionsChantier(sel) {
      return '<option value="">— Choisir le chantier —</option>' + actifs.map(function (c) {
        return '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.nom) + '</option>';
      }).join('');
    }
    function optionsPause(v) {
      return PAUSES.map(function (x) { return '<option value="' + x + '"' + (x === Number(v) ? ' selected' : '') + '>' + (x ? fh(x) : '0') + '</option>'; }).join('');
    }
    function champHeure(attr, val) {
      return '<input type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="--:--" data-heure ' + attr + ' value="' + esc(val || '') + '">';
    }
    function minutesTotal() {
      var t = 0;
      if (!absent) {
        creneaux.forEach(function (c) { if (/^\d\d:\d\d$/.test(c.debut) && /^\d\d:\d\d$/.test(c.fin) && min(c.fin) > min(c.debut)) t += min(c.fin) - min(c.debut) - (Number(c.pause) || 0); });
        Object.keys(faits).forEach(function (id) { var x = faits[id]; if (/^\d\d:\d\d$/.test(x.debut) && /^\d\d:\d\d$/.test(x.fin) && min(x.fin) > min(x.debut)) t += min(x.fin) - min(x.debut); });
      }
      return Math.max(0, t);
    }

    function dessiner(message) {
      var nomM = matin ? 'ce matin' : 'cet après-midi';
      var h = '<h2>' + (matin ? 'Matin' : 'Après-midi') + '</h2><div class="sous">' + esc(jourLong(date)) + '</div><div class="rappel">' + esc(rappel) + '</div>';
      h += '<label class="case-a-cocher"><input type="checkbox" data-absent' + (absent ? ' checked' : '') + '> Je n\'ai pas travaillé ' + nomM + '</label>';
      if (absent) {
        h += '<label class="champ"><span>Motif</span><input type="text" data-motif maxlength="120" placeholder="Congé, maladie, école…" value="' + esc(motif) + '"></label>';
      } else {
        h += '<div class="ligne-saisie"><div class="bloc-titre">Sur un chantier</div>';
        creneaux.forEach(function (c, i) {
          h += '<div class="creneau-s" data-i="' + i + '">';
          if (chantierPrevu && i === 0) {
            h += '<label class="case-a-cocher"><input type="radio" name="choix-s" data-choix-s="prevu"' + (!c.autre ? ' checked' : '') + '> Chantier prévu : <b>' + esc(nomChantier(chantierPrevu, chantiers)) + '</b></label>'
              + '<label class="case-a-cocher"><input type="radio" name="choix-s" data-choix-s="autre"' + (c.autre ? ' checked' : '') + '> J\'ai travaillé sur un autre chantier</label>';
          }
          if (c.autre || !chantierPrevu || i > 0) h += '<label class="champ"><span>Chantier</span><select data-c="chantier">' + optionsChantier(c.chantier) + '</select></label>';
          h += '<div class="trio"><label class="champ"><span>Début</span>' + champHeure('data-c="debut"', c.debut) + '</label>'
            + '<label class="champ"><span>Fin</span>' + champHeure('data-c="fin"', c.fin) + '</label>'
            + '<label class="champ"><span>Pause</span><select data-c="pause">' + optionsPause(c.pause) + '</select></label></div>'
            + (i > 0 ? '<button type="button" class="lien-btn" data-retirer="' + i + '">Retirer ce créneau</button>' : '')
            + '</div>';
        });
        h += '<div class="aide-heure">Tapez l\'heure au clavier : 0830 pour 8h30. Pas encore fini ? Laisse la fin vide et reviens la mettre en partant.' + (listeTravaux.length ? ' À laisser vide si tu n\'as fait que des travaux en attente.' : '') + '</div>'
          + '<button type="button" class="lien-btn" data-ajouter>+ Un autre créneau</button></div>';
        if (listeTravaux.length) {
          var nbCoches = Object.keys(faits).length;
          h += '<button type="button" class="replie" data-deroule><span>Travaux en attente faits ' + nomM + '</span><span class="nb">' + (nbCoches || listeTravaux.length) + '</span><span class="fl">' + (deroule ? '▴' : '▾') + '</span></button>';
          if (deroule) {
            h += '<div class="travaux-s">' + listeTravaux.map(function (t) {
              var x = faits[t.id];
              var r = '<div class="tache-saisie"><label class="case-a-cocher"><input type="checkbox" data-travail="' + esc(t.id) + '"' + (x ? ' checked' : '') + '> <span><b>' + esc(t.texte) + '</b><small>' + esc(t.chantierNom || '') + (t.minutes ? ' · commencé : ' + esc(tempsPar(t)) : '') + '</small></span></label>';
              if (x) {
                r += '<div class="trio deux"><label class="champ"><span>De</span>' + champHeure('data-tdeb="' + esc(t.id) + '"', x.debut) + '</label>'
                  + '<label class="champ"><span>À</span>' + champHeure('data-tfin="' + esc(t.id) + '"', x.fin) + '</label></div>'
                  + '<div class="choix-fini"><button type="button" class="' + (x.termine ? 'on' : '') + '" data-tfini="' + esc(t.id) + '|1">Terminé</button>'
                  + '<button type="button" class="' + (!x.termine ? 'on' : '') + '" data-tfini="' + esc(t.id) + '|0">Pas fini</button></div>';
              }
              return r + '</div>';
            }).join('') + '</div>';
          }
        }
        h += '<div class="total-s">Total ' + nomM + ' : <b data-total>' + fh(minutesTotal()) + '</b></div>'
          + '<label class="champ"><span>Commentaire pour le bureau (facultatif)</span><textarea data-comm rows="3" maxlength="2000">' + esc(commentaire) + '</textarea></label>';
      }
      if (message) h += '<div class="erreur-saisie">' + esc(message) + '</div>';
      h += '<div class="pied"><button type="button" class="btn second" data-annuler>Annuler</button><button type="button" class="btn" data-ok>Enregistrer ' + (matin ? 'le matin' : 'l\'après-midi') + '</button></div>';
      if (ceMoment.length) h += '<div style="text-align:center;margin-top:6px"><button type="button" class="lien-btn" data-effacer>Effacer ' + (matin ? 'le matin' : 'l\'après-midi') + '</button></div>';
      f.innerHTML = h;
    }

    function lire() {
      var m = f.querySelector('[data-motif]'); if (m) motif = m.value;
      var cm = f.querySelector('[data-comm]'); if (cm) commentaire = cm.value;
      f.querySelectorAll('.creneau-s').forEach(function (bloc) {
        var c = creneaux[Number(bloc.getAttribute('data-i'))];
        bloc.querySelectorAll('[data-c]').forEach(function (x) {
          var k = x.getAttribute('data-c');
          c[k] = k === 'pause' ? Number(x.value) : k === 'chantier' ? x.value : (lireHeure(x.value) || x.value.trim());
        });
        if (!c.autre && chantierPrevu && Number(bloc.getAttribute('data-i')) === 0) c.chantier = chantierPrevu;
      });
      f.querySelectorAll('[data-tdeb]').forEach(function (x) { var id = x.getAttribute('data-tdeb'); if (faits[id]) faits[id].debut = lireHeure(x.value) || x.value.trim(); });
      f.querySelectorAll('[data-tfin]').forEach(function (x) { var id = x.getAttribute('data-tfin'); if (faits[id]) faits[id].fin = lireHeure(x.value) || x.value.trim(); });
    }

    function construire() {
      lire();
      if (absent) {
        return { lignes: [{ chantier: '', remarque: motif.trim() || 'Absent', debut: matin ? '00:00' : '12:00', fin: matin ? '12:00' : '23:59' }],
          etats: dejaFaits.reduce(function (o, id) { o[id] = 'a_faire'; return o; }, {}) };
      }
      var heureOk = function (h) { return /^\d\d:\d\d$/.test(h); };
      var lignes = [];
      for (var i = 0; i < creneaux.length; i++) {
        var c = creneaux[i];
        var vide = !c.debut && !c.fin;
        if (vide && i === 0 && Object.keys(faits).length) continue; // seulement des travaux en attente
        if (vide && i === 0) return { erreur: 'Indique tes heures, ou coche un travail en attente fait.' };
        if (!c.chantier) return { erreur: 'Choisis le chantier.' };
        if (!heureOk(c.debut) || (c.fin && !heureOk(c.fin))) return { erreur: 'Heure illisible : tape par exemple 0830 pour 8h30.' };
        lignes.push({ chantier: c.chantier, debut: c.debut, fin: c.fin, pause: c.pause, remarque: '' });
      }
      var etats = {};
      var ids = Object.keys(faits);
      for (var j = 0; j < ids.length; j++) {
        var x = faits[ids[j]], t = travailParId(ids[j]);
        if (!heureOk(x.debut) || !heureOk(x.fin)) return { erreur: 'Indique de quelle heure à quelle heure pour « ' + (t ? t.texte : 'le travail') + ' ».' };
        lignes.push({ chantier: t ? t.chantier : '', travail: ids[j], debut: x.debut, fin: x.fin, pause: 0, remarque: '' });
        etats[ids[j]] = x.termine ? 'fait' : 'a_faire';
      }
      dejaFaits.forEach(function (id) { if (!faits[id]) etats[id] = 'a_faire'; });
      if (lignes.length && commentaire.trim()) lignes[0].remarque = commentaire.trim();
      var pb = valider(autres.concat(lignes));
      if (pb) return { erreur: pb };
      return { lignes: lignes, etats: etats };
    }

    f.addEventListener('change', function (e) {
      var t = e.target;
      if (t.hasAttribute('data-absent')) { lire(); absent = t.checked; dessiner(); return; }
      if (t.hasAttribute('data-choix-s')) { lire(); creneaux[0].autre = t.getAttribute('data-choix-s') === 'autre'; creneaux[0].chantier = creneaux[0].autre ? '' : chantierPrevu; dessiner(); return; }
      if (t.hasAttribute('data-travail')) {
        lire();
        var id = t.getAttribute('data-travail');
        if (t.checked) faits[id] = { debut: '', fin: '', termine: true }; else delete faits[id];
        dessiner(); return;
      }
      lire(); var tot = f.querySelector('[data-total]'); if (tot) tot.textContent = fh(minutesTotal());
    });
    f.addEventListener('input', function () { lire(); var tot = f.querySelector('[data-total]'); if (tot) tot.textContent = fh(minutesTotal()); });
    f.addEventListener('focusin', function (e) { if (e.target.hasAttribute && e.target.hasAttribute('data-heure')) setTimeout(function () { e.target.select(); }, 0); });
    f.addEventListener('focusout', function (e) {
      if (!e.target.hasAttribute || !e.target.hasAttribute('data-heure')) return;
      var h = lireHeure(e.target.value); if (h) e.target.value = h;
    });
    dessiner();
  }

  /** Correction de toute la journée d'un coup (ancienne saisie d'un seul bloc 8h–17h). */
  function saisirJournee(jour) {
    var reel = parJour(S.reel)[S.id + '|' + jour] || [];
    fenetreJour({
      titre: 'Corriger mes heures', date: jour, lignes: reel,
      chantiers: S.chantiers, libelleAbsence: 'Je n\'ai pas travaillé ce jour-là', peutEffacer: reel.length > 0,
      libelleRemarque: 'Commentaire pour le bureau (facultatif)',
      enregistrer: function (lignes) { enregistrerSalarie(jour, lignes); }
    });
  }

  function enregistrerSalarie(date, lignes, travauxEtat) {
    // Les travaux cochés changent d'état tout de suite à l'écran ; Google renvoie ensuite la liste à jour
    Object.keys(travauxEtat || {}).forEach(function (id) {
      var t = travailParId(id);
      if (!t) return;
      t.statut = travauxEtat[id];
      if (t.statut === 'fait') { t.faitPar = S.nom; t.faitLe = date; }
    });
    envoyer({ type: 'reel', per: S, sal: S.id, dates: [date], lignes: lignes,
      action: 'moi.enregistrer', donnees: { date: date, lignes: lignes, travauxEtat: travauxEtat || {} },
      apres: function (rep) { if (rep && rep.travaux) S.travaux = rep.travaux; },
      redessiner: dessinerSalarie });
  }

  // ------------------------------------------------------------------ onglet « Travaux »
  function htmlTravauxS() {
    var ouverts = travauxOuverts();
    var debutSemaine = lundiDe(S.aujourdhui);
    var faitsSemaine = (S.travaux || []).filter(function (t) { return t.statut === 'fait' && t.faitLe >= debutSemaine; });
    var h = '<div class="astuce" style="margin-top:4px">Touche un travail quand tu l\'as fait (ou commencé) : tu indiques tes heures, elles comptent dans ta journée.</div>';
    if (!ouverts.length) h += '<div class="message info">Aucun travail en attente pour l\'instant.</div>';
    ouverts.forEach(function (t) {
      h += '<button type="button" class="tache-s" data-tache="' + esc(t.id) + '"><span class="coche-s"></span><span class="tache-txt"><b>' + esc(t.texte) + '</b>'
        + '<small>' + esc(t.chantierNom || '') + (t.creePar ? ' · ajouté par ' + esc(String(t.creePar).split(' ')[0]) : '') + '</small>'
        + (t.minutes ? '<span class="etat-s">commencé : ' + esc(tempsPar(t)) + '</span>' : '') + '</span></button>';
    });
    h += '<button type="button" class="btn second plein" data-proposer style="margin-top:6px">+ Ajouter un travail</button>';
    if (faitsSemaine.length) {
      h += '<div class="titre-section">Faits cette semaine</div>' + faitsSemaine.map(function (t) {
        return '<div class="tache-s faite"><span class="coche-s on">✓</span><span class="tache-txt"><b>' + esc(t.texte) + '</b><small>Fait par '
          + esc(String(t.faitPar || '').split(' ')[0]) + ' le ' + esc(t.faitLe ? jourCourt(t.faitLe) : '') + (t.minutes ? ' · ' + hCourt(t.minutes) : '') + '</small></span></div>';
      }).join('');
    }
    return h;
  }

  /** Cocher un travail depuis l'onglet Travaux : le jour, de quelle heure à quelle heure, terminé ou pas. */
  function ouvrirTache(id) {
    var t = travailParId(id);
    if (!t) return;
    var jours = [];
    for (var i = 0; i <= 2; i++) jours.push(plusJours(S.aujourdhui, -i)); // raccourcis ; « Autre jour » ouvre tout le passé
    var etat = { date: S.aujourdhui, debut: '', fin: '', termine: true, comm: '' };
    var fen = fenetreSimple('', function (b, fermer) {
      lireT();
      if (b.hasAttribute('data-annuler')) { fermer(); return; }
      if (b.hasAttribute('data-tjour')) { etat.date = b.getAttribute('data-tjour'); dessinerT(); return; }
      if (b.hasAttribute('data-tfini')) { etat.termine = b.getAttribute('data-tfini').split('|')[1] === '1'; dessinerT(); return; }
      if (b.hasAttribute('data-ok')) {
        if (!/^\d\d:\d\d$/.test(etat.debut) || !/^\d\d:\d\d$/.test(etat.fin)) { dessinerT('Indique de quelle heure à quelle heure : 1330 pour 13h30.'); return; }
        var r = parJour(S.reel)[S.id + '|' + etat.date] || [];
        var ligne = { chantier: t.chantier, travail: t.id, debut: etat.debut, fin: etat.fin, pause: 0, remarque: etat.comm.trim() };
        var pb = valider(r.concat([ligne]));
        if (pb) { dessinerT(pb); return; }
        // Un jour plus ancien que ce qui est chargé : on va d'abord chercher ses heures, pour ne pas les écraser
        if (etat.date < S.du) {
          b.disabled = true;
          api('moi.semaine', { du: lundiDe(etat.date), au: S.au }).then(function (rep) {
            fusionner(S, rep); b.disabled = false; b.click();
          }, function (e) { b.disabled = false; dessinerT(e.message); });
          return;
        }
        var etats = {}; etats[t.id] = etat.termine ? 'fait' : 'a_faire';
        fermer();
        enregistrerSalarie(etat.date, r.map(function (l) { return { chantier: l.chantier, debut: l.debut, fin: l.fin, pause: l.pause, remarque: l.remarque, travail: l.travail || '' }; }).concat([ligne]), etats);
      }
    });
    var f = fen.f;
    function lireT() {
      var a = f.querySelector('[data-tdeb]'), b = f.querySelector('[data-tfin]'), c = f.querySelector('[data-comm]');
      if (a) etat.debut = lireHeure(a.value) || a.value.trim();
      if (b) etat.fin = lireHeure(b.value) || b.value.trim();
      if (c) etat.comm = c.value;
    }
    function dessinerT(message) {
      var h = '<h2>' + esc(t.texte) + '</h2><div class="sous">' + esc(t.chantierNom || '') + '</div><div class="rappel">Ces heures s\'ajoutent à ta journée.</div>'
        + '<div class="bloc-titre">Quel jour ?</div><div class="choix-fini">' + jours.map(function (dt) {
          return '<button type="button" class="' + (dt === etat.date ? 'on' : '') + '" data-tjour="' + dt + '">' + (dt === S.aujourdhui ? 'Aujourd\'hui' : esc(jourCourt(dt))) + '</button>';
        }).join('') + '</div>'
        + '<label class="champ" style="margin-top:8px"><span>Autre jour</span><input type="date" data-tautre max="' + esc(S.aujourdhui) + '" value="' + (jours.indexOf(etat.date) < 0 ? esc(etat.date) : '') + '"></label>'
        + '<div class="trio deux" style="margin-top:10px"><label class="champ"><span>De</span><input type="text" inputmode="numeric" maxlength="5" placeholder="--:--" data-heure data-tdeb value="' + esc(etat.debut) + '"></label>'
        + '<label class="champ"><span>À</span><input type="text" inputmode="numeric" maxlength="5" placeholder="--:--" data-heure data-tfin value="' + esc(etat.fin) + '"></label></div>'
        + '<div class="choix-fini"><button type="button" class="' + (etat.termine ? 'on' : '') + '" data-tfini="x|1">Terminé</button><button type="button" class="' + (!etat.termine ? 'on' : '') + '" data-tfini="x|0">Pas fini</button></div>'
        + '<label class="champ" style="margin-top:10px"><span>Commentaire (facultatif)</span><textarea data-comm rows="2" maxlength="2000">' + esc(etat.comm) + '</textarea></label>'
        + (message ? '<div class="erreur-saisie">' + esc(message) + '</div>' : '')
        + '<div class="pied"><button type="button" class="btn second" data-annuler>Annuler</button><button type="button" class="btn" data-ok>Enregistrer</button></div>';
      f.innerHTML = h;
    }
    f.addEventListener('change', function (e) {
      if (!e.target.hasAttribute || !e.target.hasAttribute('data-tautre')) return;
      var v = e.target.value;
      if (!/^\d{4}-\d\d-\d\d$/.test(v)) return;
      lireT();
      if (v > S.aujourdhui) { dessinerT('On ne peut pas saisir un jour qui n’est pas encore passé.'); return; }
      etat.date = v; dessinerT();
    });
    f.addEventListener('focusin', function (e) { if (e.target.hasAttribute && e.target.hasAttribute('data-heure')) setTimeout(function () { e.target.select(); }, 0); });
    f.addEventListener('focusout', function (e) { if (e.target.hasAttribute && e.target.hasAttribute('data-heure')) { var h = lireHeure(e.target.value); if (h) e.target.value = h; } });
    dessinerT();
  }

  /** Un ouvrier ajoute un travail repéré : il entre directement dans la liste commune. */
  function ouvrirProposer() {
    var actifs = S.chantiers.filter(function (c) { return c.actif; });
    var fen = fenetreSimple('<h2>Ajouter un travail</h2><div class="sous">Il s\'ajoute à la liste de tout le monde.</div>'
      + '<label class="champ"><span>Le travail</span><textarea data-ptexte rows="2" maxlength="200" placeholder="Ex. : fuite sous l\'évier de la cuisine"></textarea></label>'
      + '<label class="champ"><span>Chantier</span><select data-pchantier><option value="">— Choisir le chantier —</option>' + actifs.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.nom) + '</option>'; }).join('') + '</select></label>'
      + '<div class="erreur-saisie" data-perr></div>'
      + '<div class="pied"><button type="button" class="btn second" data-fermer>Annuler</button><button type="button" class="btn" data-ok>Ajouter</button></div>',
      function (b, fermer, f) {
        if (!b.hasAttribute('data-ok')) return;
        var texte = f.querySelector('[data-ptexte]').value.trim(), ch = f.querySelector('[data-pchantier]').value;
        if (!texte || !ch) { f.querySelector('[data-perr]').textContent = 'Décris le travail et choisis le chantier.'; return; }
        b.disabled = true;
        api('moi.travail', { texte: texte, chantier: ch }).then(function (r) {
          S.travaux = r.travaux; fermer(); dessinerSalarie(); toast('Travail ajouté ✓');
        }).catch(function (e) { b.disabled = false; f.querySelector('[data-perr]').textContent = e.message; });
      });
  }

  // ------------------------------------------------------------------ onglet « Mes heures »
  function htmlMesHeures() {
    var re = parJour(S.reel), pr = parJour(S.prevu);
    var auj = S.aujourdhui;
    var faitesJour = function (dt) { return total(re[S.id + '|' + dt] || []); };
    var lundi = lundiDe(auj);
    var h = '';
    // Cette semaine
    var semaine = 0, prevues = 0, reste = [], lignes = '';
    for (var i = 0; i < 7; i++) {
      var dt = plusJours(lundi, i);
      var p = pr[S.id + '|' + dt] || [], r = re[S.id + '|' + dt] || [];
      if (i === 6 && !p.length && !r.length) continue;
      var t = total(r);
      semaine += t; prevues += total(p);
      var note = '';
      if (dt <= auj && p.some(function (l) { return l.chantier; }) && !journeeSaisie(p, r)) {
        var manque = [true, false].filter(function (m) { return pourMoment(p, m).some(function (l) { return l.chantier; }) && !pourMoment(r, m).length; });
        var quoi = manque.length === 2 ? '' : (manque[0] ? ' matin' : ' après-midi');
        reste.push(JOURS[d(dt).getUTCDay()] + quoi);
        note = '<i>' + (manque.length === 2 ? 'à saisir' : (manque[0] ? 'matin à saisir' : 'après-midi à saisir')) + '</i>';
      }
      lignes += '<div class="ligne-h' + (dt > auj ? ' gris' : '') + '"><span>' + esc(jourCourt(dt)) + '</span>' + note + '<b>' + (t ? hCourt(t) : '—') + '</b></div>';
    }
    h += '<div class="bloc-h"><div class="bloc-titre">Cette semaine · ' + esc(titreSemaine(lundi).replace('Semaine du ', '')) + '</div>'
      + '<div class="chiffre-h">' + hCourt(semaine) + ' <small>faites</small></div>'
      + '<div class="sous-h">' + hCourt(prevues) + ' prévues' + (reste.length ? ' · encore à saisir : ' + esc(reste.join(', ')) : '') + '</div>' + lignes + '</div>';
    // Ce mois-ci, semaine par semaine
    var mois = auj.slice(0, 7);
    var debutMois = mois + '-01';
    var finMois = (function () { var x = d(debutMois); x.setUTCMonth(x.getUTCMonth() + 1); x.setUTCDate(0); return x.toISOString().slice(0, 10); })();
    var totMois = 0, lignesMois = '';
    for (var l = lundiDe(debutMois); l <= finMois; l = plusJours(l, 7)) {
      var du = l < debutMois ? debutMois : l, au = plusJours(l, 6) > finMois ? finMois : plusJours(l, 6);
      if (du > auj) break;
      var tw = 0;
      for (var x2 = du; x2 <= au; x2 = plusJours(x2, 1)) tw += faitesJour(x2);
      totMois += tw;
      var jourDu = d(du).getUTCDate();
      lignesMois += '<div class="ligne-h"><span>Semaine du ' + (jourDu === 1 ? '1er' : jourDu) + '</span><b>' + hCourt(tw) + '</b></div>';
    }
    h += '<div class="bloc-h"><div class="bloc-titre">' + maj(MOIS_LONGS[Number(mois.slice(5, 7)) - 1]) + ' ' + mois.slice(0, 4) + '</div>'
      + '<div class="chiffre-h">' + hCourt(totMois) + ' <small>faites</small></div>' + lignesMois + '</div>';
    // Le mois dernier
    var prec = (function () { var x = d(debutMois); x.setUTCMonth(x.getUTCMonth() - 1); return x.toISOString().slice(0, 7); })();
    var debutPrec = prec + '-01';
    if (S.du <= debutPrec) {
      var totPrec = 0;
      for (var x3 = debutPrec; x3 < debutMois; x3 = plusJours(x3, 1)) totPrec += faitesJour(x3);
      h += '<div class="bloc-h ligne-mois"><span>' + maj(MOIS_LONGS[Number(prec.slice(5, 7)) - 1]) + ' ' + prec.slice(0, 4) + '</span><b>' + hCourt(totPrec) + '</b></div>';
    }
    return h + '<div class="astuce">Heures saisies, pauses déduites.</div>';
  }

  app.addEventListener('click', function (e) {
    if (CONF.role !== 'salarie') return;
    var b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-onglet-s')) { ongletS = b.getAttribute('data-onglet-s'); dessinerSalarie(); window.scrollTo(0, 0); return; }
    if (b.hasAttribute('data-sem')) {
      var n = Number(b.getAttribute('data-sem'));
      lundiAffiche = n === 0 ? lundiDe(S.aujourdhui) : plusJours(lundiAffiche, n);
      naviguer(S, lundiAffiche, 'moi.semaine', dessinerSalarie);
      return;
    }
    if (b.hasAttribute('data-renvoyer')) {
      var jr = b.getAttribute('data-renvoyer');
      enregistrerSalarie(jr, ENVOIS['reel|' + S.id + '|' + jr].lignes);
      return;
    }
    if (b.hasAttribute('data-moment')) {
      var x = b.getAttribute('data-moment').split('|');
      saisirMoment(x[0], x[1] === 'm');
      return;
    }
    if (b.hasAttribute('data-detail')) { ouvrirDetail(b.getAttribute('data-detail')); return; }
    if (b.hasAttribute('data-tache')) { ouvrirTache(b.getAttribute('data-tache')); return; }
    if (b.hasAttribute('data-proposer')) { ouvrirProposer(); return; }
  });

  // ------------------------------------------------------------------------------------------
  // Vue des responsables
  // ------------------------------------------------------------------------------------------
  var A = { init: null, d: null, lundi: null, mois: null, onglet: 'planning', dimanche: false }; // d = environ trois mois chargés

  function responsable(r) {
    document.getElementById('qui').textContent = r.nom;
    var premier = !A.init;
    A.init = r.init; A.d = r.d;
    reappliquerEnvois(A.d);
    if (premier) { A.lundi = lundiDe(r.d.aujourdhui); A.mois = r.d.aujourdhui.slice(0, 7); }
    // Données fraîches pendant qu'on tape dans Réglages : on ne redessine pas, on perdrait la frappe
    if (!premier && A.onglet === 'reglages') return;
    if (A.lundi < A.d.du || plusJours(A.lundi, 6) > A.d.au) { naviguer(A.d, A.lundi, 'admin.semaine', redessinerGrille); return; }
    dessinerAdmin();
    chargerMoisSiBesoin();
  }

  /**
   * Écran du bureau : les heures saisies par les salariés arrivent toutes seules, sans recharger la page.
   * Google est interrogé toutes les 20 secondes et dès qu'on revient sur l'onglet ; l'écran n'est redessiné
   * que si quelque chose a changé, et jamais pendant qu'une fenêtre est ouverte, qu'on tape ou qu'un envoi part.
   */
  var RAFRAICHIR_MS = 20000;
  var rafraichEnCours = false;
  function empreinte(per, du, au) {
    return ['prevu', 'reel'].map(function (t) {
      return per[t].filter(function (x) { return x.date >= du && x.date <= au; }).map(function (x) {
        return [x.date, x.salarie, x.chantier, x.debut, x.fin, x.pause, x.remarque, x.travail || ''].join('~');
      }).sort().join('|');
    }).join('#');
  }
  function occupe() {
    var a = document.activeElement;
    return envoisEnCours > 0 || !!document.querySelector('.voile')
      || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  }
  function rafraichirBureau() {
    if (CONF.role !== 'responsable' || !A.d || rafraichEnCours || document.hidden) return;
    if (A.onglet === 'reglages' || A.onglet === 'travaux' || occupe()) return;
    rafraichEnCours = true;
    var du = A.d.du, au = A.d.au;
    api('admin.semaine', { du: du, au: au }).then(function (r) {
      rafraichEnCours = false;
      if (occupe() || A.onglet === 'reglages' || A.onglet === 'travaux') return; // on réessaiera au prochain tour
      var avant = empreinte(A.d, r.du, r.au);
      fusionner(A.d, r, true);
      if (empreinte(A.d, r.du, r.au) === avant) return;
      var cadre = document.querySelector('.grille-cadre'), gauche = cadre ? cadre.scrollLeft : 0, haut = window.scrollY;
      dessinerAdmin();
      var c2 = document.querySelector('.grille-cadre'); if (c2) c2.scrollLeft = gauche;
      window.scrollTo(0, haut);
    }, function () { rafraichEnCours = false; /* réseau coupé : on réessaiera au prochain tour */ });
  }
  setInterval(rafraichirBureau, RAFRAICHIR_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) rafraichirBureau(); });

  // Un envoi qui se termine ne redessine pas l'onglet Réglages : on y perdrait ce qui est en cours de frappe
  function redessinerGrille() { if (A.onglet !== 'reglages' && A.onglet !== 'travaux') dessinerAdmin(); }
  if (window.matchMedia) {
    var mq = window.matchMedia('(max-width: 760px)');
    var auChangement = function () { if (CONF.role === 'responsable' && A.init) redessinerGrille(); };
    if (mq.addEventListener) mq.addEventListener('change', auChangement); else if (mq.addListener) mq.addListener(auChangement);
  }

  // ------------------------------------------------------------------------------------------
  // Export du planning sur plusieurs semaines, en A4 portrait
  // ------------------------------------------------------------------------------------------
  function choisirSemaines() {
    var voile = el('<div class="voile"></div>');
    var f = el('<div class="fenetre"><h2>Exporter le planning en PDF</h2>'
      + '<div class="sous">À partir de la ' + esc(titreSemaine(A.lundi).replace('Semaine', 'semaine')) + ', A4 portrait</div>'
      + '<div class="bloc-titre">Nombre de semaines</div><div class="choix-semaines">'
      + [1, 2, 3, 4, 5, 6].map(function (n) { return '<button type="button" class="btn ' + (n === 4 ? '' : 'second ') + '" data-nb="' + n + '">' + n + '</button>'; }).join('')
      + '</div><div class="pied"><button type="button" class="btn second" data-annuler>Annuler</button></div></div>');
    voile.appendChild(f);
    document.body.appendChild(voile);
    f.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.hasAttribute('data-annuler')) { voile.remove(); return; }
      if (b.hasAttribute('data-nb')) { voile.remove(); exporterSemaines(Number(b.getAttribute('data-nb'))); }
    });
  }

  function exporterSemaines(n) {
    var du = A.lundi, au = plusJours(A.lundi, 7 * n - 1);
    if (du >= A.d.du && au <= A.d.au) { imprimerSemaines(n); return; }
    toast('Préparation du PDF…');
    api('admin.semaine', { du: du < A.d.du ? du : A.d.du, au: au > A.d.au ? au : A.d.au }).then(function (r) {
      fusionner(A.d, r);
      imprimerSemaines(n);
    }).catch(function (e) { toast(e.message); });
  }

  function imprimerSemaines(n) {
    var ch = chantiersParId();
    var pr = parJour(A.d.prevu), re = parJour(A.d.reel);
    var fin = plusJours(A.lundi, 7 * n - 1);
    var h = '<div class="impr-tete"><span><b>Vosges Rénovation — Planning</b> — du ' + esc(jourLong(A.lundi).toLowerCase()) + ' au ' + esc(jourLong(fin).toLowerCase()) + ' ' + fin.slice(0, 4) + '</span>'
      + '<span class="impr-legende"><span class="pastille"></span> heures saisies (sinon : prévu)</span></div>';
    for (var w = 0; w < n; w++) {
      var lundi = plusJours(A.lundi, 7 * w);
      var jours = [];
      for (var i = 0; i < 7; i++) {
        var j = plusJours(lundi, i);
        var dimancheUtile = A.dimanche || A.init.salaries.some(function (s) { return pr[s.id + '|' + j] || re[s.id + '|' + j]; });
        if (i < 6 || dimancheUtile) jours.push(j);
      }
      var salaries = A.init.salaries.filter(function (s) {
        return s.actif || jours.some(function (j) { return pr[s.id + '|' + j] || re[s.id + '|' + j]; });
      });
      h += '<div class="impr-semaine"><div class="impr-titre">' + esc(titreSemaine(lundi)) + '</div><table class="impr"><thead><tr><th class="n"></th>'
        + jours.map(function (j) { return '<th>' + esc(jourCourt(j)) + '</th>'; }).join('') + '<th class="t">Semaine</th></tr></thead><tbody>';
      salaries.forEach(function (s) {
        var totP = 0, totR = 0;
        h += '<tr><td class="n">' + esc(s.nom) + '</td>';
        jours.forEach(function (j) {
          var p = pr[s.id + '|' + j] || [], r = re[s.id + '|' + j] || [];
          totP += total(p); totR += total(r);
          var hj = heuresPlanning(p, r);
          h += '<td class="' + (r.length ? 'r' : '') + '">' + htmlCasePlanning(p, r, ch)
            + (hj ? '<div class="hj">' + hj + '</div>' : '') + '</td>';
        });
        h += '<td class="t">Prévu ' + hCourt(totP) + '<br>Fait ' + hCourt(totR) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    var zone = document.getElementById('impression');
    zone.innerHTML = h;
    var page = document.createElement('style');
    page.textContent = '@page { size: A4 portrait; margin: 8mm; }';
    document.head.appendChild(page);
    document.body.classList.add('impr-multi');
    var nettoyer = function () {
      document.body.classList.remove('impr-multi');
      page.remove();
      zone.innerHTML = '';
      window.removeEventListener('afterprint', nettoyer);
    };
    window.addEventListener('afterprint', nettoyer);
    toast('Dans la fenêtre qui s\'ouvre, choisissez « Enregistrer au format PDF ».');
    setTimeout(function () { window.print(); }, 150);
  }

  /** Le compteur d'un mois hors de la période déjà chargée va chercher ce mois. */
  function chargerMoisSiBesoin() {
    if (A.onglet !== 'compteur') return;
    var b = bornesMois(A.mois);
    if (b.du >= A.d.du && b.au <= A.d.au) return;
    var mois = A.mois;
    api('admin.semaine', { du: b.du < A.d.du ? b.du : A.d.du, au: b.au > A.d.au ? b.au : A.d.au }).then(function (r) {
      fusionner(A.d, r);
      if (A.onglet === 'compteur' && A.mois === mois) dessinerAdmin();
    }).catch(function (e) { toast(e.message); });
  }

  var NOMS_MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  function bornesMois(mois) {
    var a = Number(mois.slice(0, 4)), m = Number(mois.slice(5, 7));
    var dernier = new Date(Date.UTC(a, m, 0)).getUTCDate();
    return { du: mois + '-01', au: mois + '-' + (dernier < 10 ? '0' : '') + dernier };
  }
  function moisVoisin(mois, n) {
    var x = new Date(Date.UTC(Number(mois.slice(0, 4)), Number(mois.slice(5, 7)) - 1 + n, 1));
    return x.toISOString().slice(0, 7);
  }

  /** Heures faites (réel saisi) de chaque salarié : une colonne par semaine du mois, et le total du mois. */

      + '<span class="espace"></span>'

      + '<div class="titre-impression">Vosges Rénovation — Heures faites — ' + maj(NOMS_MOIS[Number(A.mois.slice(5, 7)) - 1]) + ' ' + A.mois.slice(0, 4) + '</div>';
    if (b.du < A.d.du || b.au > A.d.au) return h + '<div class="chargement">Chargement…</div>';

    // Semaines du mois : du lundi au dimanche, limitées aux jours du mois
    var semaines = [];
    for (var l = lundiDe(b.du); l <= b.au; l = plusJours(l, 7)) {
      var du = l < b.du ? b.du : l, au = plusJours(l, 6) > b.au ? b.au : plusJours(l, 6);

    }
    var fait = {};
    A.d.reel.forEach(function (x) {
      if (x.date < b.du || x.date > b.au) return;

      fait[k] = (fait[k] || 0) + duree(x);
    });
    var salaries = A.init.salaries.filter(function (s) {
