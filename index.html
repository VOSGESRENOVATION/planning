<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --rouge: #C1362F;          /* couleur de Vosges Rénovation */
    --rouge-fonce: #9E2A24;
    --rouge-pale: #FBEDEC;
    --texte: #241E1D;
    --gris: #6B6362;
    --gris-clair: #9C9493;
    --bord: #E4DDDB;
    --fond: #F6F3F2;
    --carte: #FFFFFF;
    --vert: #1E7F4F;           /* ce qui va bien */
    --vert-pale: #E2F3E9;
    --rose: #B8195A;           /* écart négatif */
    --rose-pale: #FCE4EE;
    --fond-prevu: #F1EDEB;     /* colonne Prévu */
    --fond-reel: #E6F0FA;      /* colonne Réel, et « heures saisies » dans Planning */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); }
  body {
    font-family: 'Satoshi', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px; line-height: 1.4;
    -webkit-text-size-adjust: 100%;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button, input, select { font: inherit; color: inherit; }
  button, select { cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  input, select { font-size: 16px; } /* en dessous de 16px, l'iPhone zoome tout seul */

  header.bandeau {
    background: var(--rouge); color: #fff;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  header.bandeau .soc { font-weight: 700; font-size: 18px; }
  header.bandeau .quoi { opacity: .85; font-size: 15px; }
  header.bandeau .qui { margin-left: auto; font-size: 15px; opacity: .9; }

  main { max-width: 1480px; margin: 0 auto; padding: 16px; }
  .etroit { max-width: 560px; }

  .btn {
    border: 0; border-radius: 10px; padding: 12px 18px; min-height: 48px;
    background: var(--rouge); color: #fff; font-weight: 700;
  }
  .btn:active { background: var(--rouge-fonce); }
  .btn.second { background: #fff; color: var(--texte); border: 1.5px solid var(--bord); font-weight: 500; }
  .btn.plein { width: 100%; }
  .btn.petit { min-height: 38px; padding: 7px 12px; font-size: 14px; }
  .lien-btn { background: none; border: 0; padding: 8px 0; color: var(--rouge); font-weight: 500; text-decoration: underline; }

  .message { padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; }
  .message.erreur { background: var(--rose-pale); color: var(--rose); font-weight: 500; }
  .message.info { background: #fff; border: 1px solid var(--bord); }
  .chargement { color: var(--gris); padding: 30px 0; text-align: center; }

  .etat { display: none; text-align: center; font-size: 13px; padding: 5px 16px; background: var(--fond-prevu); color: var(--gris); }
  .etat.visible { display: block; }
  .etat.hors { background: var(--rose-pale); color: var(--rose); }
  #toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--texte); color: #fff; padding: 12px 18px; border-radius: 10px;
    max-width: calc(100% - 32px); display: none; z-index: 50;
  }

  /* ---------- Salarié ---------- */
  .semaine-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 14px; }
  .semaine-nav .titre { font-weight: 700; text-align: center; flex: 1; }
  .semaine-nav .btn { min-width: 48px; padding: 10px 14px; }

  .jour { background: var(--carte); border: 1px solid var(--bord); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .jour.aujourdhui { border: 2px solid var(--rouge); }
  .jour-tete { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .jour-nom { font-weight: 700; font-size: 17px; }
  .etiquette { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .etiquette.auj { background: var(--rouge); color: #fff; }
  .etiquette.ok { background: var(--vert-pale); color: var(--vert); }
  .etiquette.manque { background: var(--rose-pale); color: var(--rose); }
  .etiquette.attente { background: var(--fond); color: var(--gris); }
  .bloc { margin: 6px 0; }
  .bloc-titre { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--gris); font-weight: 700; }
  .creneau { margin: 3px 0; }
  .creneau .ch { font-weight: 700; }
  .creneau .adr { color: var(--gris); font-size: 14px; }
  .creneau .h { font-variant-numeric: tabular-nums; }
  .vide { color: var(--gris-clair); }
  .apercu { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 3px; margin: -4px 0 12px; }
  .apercu th { font-size: 13px; font-weight: 700; color: var(--gris); text-align: center; padding: 0; }
  .apercu th span { display: block; font-size: 11px; font-weight: 500; }
  .apercu th.auj { color: var(--rouge); }
  .apercu th.moment { width: 38px; font-size: 10px; text-align: left; }
  .apercu td { padding: 0; vertical-align: top; }
  .ap-case { width: 100%; min-height: 48px; padding: 4px 2px; border: 1px solid var(--bord); border-radius: 6px; background: #fff;
    font-size: 10px; font-weight: 700; line-height: 1.2; text-align: center; overflow-wrap: normal; hyphens: auto; -webkit-hyphens: auto; }
  .ap-case.auj { border: 1.5px solid var(--rouge); }
  .ap-case.reel { background: var(--fond-reel); border-color: #BCD4EC; color: #2F5E8E; }
  .ap-case.heures { min-height: 36px; font-weight: 500; font-size: 11px; font-variant-numeric: tabular-nums; }
  .moitie { padding: 2px 0 6px; }
  .moitie.suite { border-top: 1px dashed var(--bord); padding-top: 8px; }
  /* ---------- Salarié : onglets, à venir, travaux, mes heures ---------- */
  .onglets-s { display: grid; grid-template-columns: 1.15fr 1fr 1fr; margin: -16px -16px 12px; background: #fff; border-bottom: 1px solid var(--bord); position: sticky; top: 0; z-index: 5; }
  .onglet-s { background: none; border: 0; border-bottom: 3px solid transparent; padding: 13px 4px; font-size: 15px; font-weight: 500; color: var(--gris); min-height: 48px; }
  .onglet-s.actif { color: var(--rouge); font-weight: 700; border-bottom-color: var(--rouge); }
  .onglet-s .nb, .replie .nb { display: inline-block; background: var(--rouge); color: #fff; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 0 7px; margin-left: 3px; }
  .astuce { font-size: 13px; color: var(--gris); margin: -6px 2px 10px; }
  .titre-section { font-size: 12px; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: .05em; margin: 16px 2px 6px; }
  .mini { display: flex; width: 100%; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--bord); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; text-align: left; }
  .mini-d { width: 56px; flex: none; font-weight: 700; font-size: 15px; line-height: 1.15; }
  .mini-d small { display: block; font-weight: 500; color: var(--gris); font-size: 12px; }
  .mini-c { flex: 1; font-size: 14px; line-height: 1.4; min-width: 0; }
  .mini .chev, .tache-s .chev { color: var(--gris-clair); font-size: 20px; }
  .ap-case.asais { font-size: 9px; font-style: italic; font-weight: 500; color: var(--gris); border-style: dashed; }
  .incite { margin-top: 10px; font-size: 13px; color: var(--gris); }
  .tache-s { display: flex; width: 100%; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--bord); border-radius: 12px; padding: 12px; margin-bottom: 8px; text-align: left; }
  .coche-s { width: 26px; height: 26px; border-radius: 7px; border: 2px solid #C9C0BD; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; }
  .coche-s.on { background: var(--vert); border-color: var(--vert); }
  .tache-txt b { display: block; font-size: 15px; } .tache-txt small { display: block; font-size: 13px; color: var(--gris); }
  .etat-s { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; background: var(--fond-reel); color: #2F5E8E; }
  .tache-s.faite { opacity: .6; } .tache-s.faite b { text-decoration: line-through; }
  .replie { display: flex; width: 100%; align-items: center; gap: 6px; background: #fff; border: 1.5px solid var(--bord); border-radius: 12px; padding: 12px; margin-top: 10px; font-weight: 700; font-size: 15px; text-align: left; }
  .replie .fl { margin-left: auto; color: var(--gris); }
  .travaux-s { border: 1px solid var(--bord); border-top: 0; border-radius: 0 0 12px 12px; padding: 4px 12px 8px; margin-top: -6px; background: #fff; }
  .tache-saisie { border-top: 1px solid #F1ECEA; padding: 6px 0; }
  .tache-saisie:first-child { border-top: 0; }
  .tache-saisie .case-a-cocher { align-items: flex-start; padding: 6px 0; }
  .tache-saisie small { display: block; color: var(--gris); font-size: 12px; font-weight: 500; }
  .trio.deux { grid-template-columns: 1fr 1fr; }
  .choix-fini { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .choix-fini button { flex: 1; min-height: 40px; border: 1.5px solid var(--bord); border-radius: 9px; background: #fff; font-size: 14px; }
  .choix-fini button.on { border-color: var(--vert); background: var(--vert-pale); color: var(--vert); font-weight: 700; }
  .total-s { background: var(--fond-reel); border-radius: 10px; padding: 9px 12px; margin: 10px 0; font-size: 15px; }
  .creneau-s + .creneau-s { border-top: 1px dashed var(--bord); margin-top: 8px; padding-top: 8px; }
  .bloc-h { background: #fff; border: 1px solid var(--bord); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .chiffre-h { font-size: 19px; font-weight: 700; margin: 2px 0; } .chiffre-h small { font-size: 13px; font-weight: 500; color: var(--gris); }
  .sous-h { font-size: 13px; color: var(--gris); margin-bottom: 6px; }
  .ligne-h { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid #F1ECEA; font-size: 14px; }
  .ligne-h span { flex: 1; } .ligne-h i { font-size: 12px; color: var(--gris); font-style: normal; } .ligne-h.gris { color: var(--gris-clair); }
  .bloc-h.ligne-mois { display: flex; justify-content: space-between; font-size: 15px; }
  /* ---------- Bureau : onglet Travaux ---------- */
  .tr-rang { align-items: center; }
  .tr-txt { flex: 1; min-width: 200px; } .tr-txt b { display: block; } .tr-txt small { display: block; color: var(--gris); font-size: 13px; }
  .tr-select { min-height: 40px; padding: 6px 8px; border: 1.5px solid var(--bord); border-radius: 8px; background: #fff; }
  .st-tr { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 10px; background: var(--fond-prevu); color: var(--gris); white-space: nowrap; }
  .st-tr.commence { background: var(--fond-reel); color: #2F5E8E; } .st-tr.fait { background: var(--vert-pale); color: var(--vert); }
  /* ---------- Salarié : bonjour, carte cliquable, demi-journées ---------- */
  .bonjour { font-size: 24px; font-weight: 700; margin: 2px 2px 12px; }
  .bouton-jour { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; background: none; border: 0; padding: 0 0 8px; margin: 0 0 4px; text-align: left; border-bottom: 1px solid var(--bord); }
  .jour-droite { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .bouton-jour .voir { font-size: 14px; font-weight: 700; color: var(--rouge); white-space: nowrap; }
  .hero { background: #8E2520; color: #fff; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .hero .d { font-size: 13px; opacity: .85; }
  .hero .bj { font-size: 22px; font-weight: 700; margin: 2px 0 8px; }
  .hero .et { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #FFD2CC; }
  .hero .ch { font-size: 19px; font-weight: 700; }
  .hero .inf { font-size: 15px; opacity: .92; }
  .hero .sep { border-top: 1px solid rgba(255,255,255,.25); margin: 9px 0; }
  .consignes { background: #fff; border: 1px solid var(--bord); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .bloc-cons + .bloc-cons { border-top: 1px solid var(--bord); margin-top: 9px; padding-top: 9px; }
  .consignes .ct { font-size: 12px; font-weight: 700; color: var(--rouge); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .consignes .l, .consignes-liste .l { font-size: 15px; padding: 2px 0 2px 16px; position: relative; }
  .consignes .l::before, .consignes-liste .l::before { content: '–'; position: absolute; left: 0; color: var(--gris); }
  .moment-jour + .moment-jour { border-top: 1px solid var(--bord); margin-top: 10px; padding-top: 10px; }
  .deux-col { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .deux-col > * { min-width: 0; overflow-wrap: anywhere; }
  .deux-col .r { border-left: 1px solid var(--bord); padding-left: 12px; }
  .deux-col .k { font-size: 10px; font-weight: 700; color: var(--gris-clair); text-transform: uppercase; letter-spacing: .05em; }
  .deux-col .r .k { color: #2F5E8E; }
  .asaisir { color: var(--gris-clair); font-style: italic; font-size: 14px; }
  .comm { font-size: 13px; color: var(--gris); white-space: pre-line; margin-top: 2px; }
  .lien-consignes { display: flex; width: 100%; justify-content: space-between; align-items: center; margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--bord); background: #fff; text-align: left; font-weight: 700; font-size: 15px; }
  .lien-consignes small { display: block; font-weight: 500; font-size: 13px; color: var(--gris); }
  .lien-consignes .chev { font-size: 22px; color: var(--gris); }
  .rappel { font-size: 14px; color: var(--gris); background: var(--fond-prevu); border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; }
  .choix-chantier { margin-bottom: 6px; }
  .choix-chantier .case-a-cocher { padding: 6px 0; }
  .champ textarea { width: 100%; min-height: 70px; padding: 8px 10px; border: 1.5px solid var(--bord); border-radius: 8px; background: #fff; font: inherit; font-size: 16px; resize: vertical; }
  .det-chantier { border: 1px solid var(--bord); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .det-chantier .ch { font-weight: 700; font-size: 17px; }
  .det-chantier .adr { color: var(--gris); font-size: 14px; }
  .consignes-liste { margin-top: 6px; }
  .comm-lecture { background: var(--fond); border-radius: 8px; padding: 7px 10px; margin-top: 6px; white-space: pre-line; font-size: 14px; }
  .comm-lecture b { display: block; font-size: 12px; color: var(--gris); }
  .info-lecture { margin-bottom: 12px; }
  /* ---------- Responsables : repères, vue téléphone ---------- */
  .reperes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .repere { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--bord); color: var(--gris); background: #fff; }
  .repere.com { color: #2F5E8E; border-color: #BCD4EC; }
  .case.cmp .dbl-c.manque-r { background: #fff; border: 1px dashed #BCD4EC; color: var(--gris-clair); font-style: italic; font-size: 12px; }
  table.compteur tr.ligne-total td { font-weight: 700; border-top: 2px solid var(--bord); }
  .jours-chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px; }
  .chip { border: 1.5px solid var(--bord); background: #fff; border-radius: 10px; padding: 10px 1px; font-size: 13px; font-weight: 500; min-height: 44px; white-space: nowrap; }
  .carte-sal .dbl-c.manque-r { background: #fff; border: 1px dashed #BCD4EC; color: var(--gris-clair); font-style: italic; }
  .chip.auj { border-color: var(--rouge); }
  .chip.actif { background: var(--rouge); border-color: var(--rouge); color: #fff; font-weight: 700; }
  .carte-sal { display: block; width: 100%; text-align: left; background: #fff; border: 1.5px solid var(--bord); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
  .carte-sal.case-reel { background: var(--fond-reel); border-color: #BCD4EC; }
  .carte-sal .nom-sal { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .carte-sal .ch { font-weight: 700; }
  .carte-sal .dbl-c { background: var(--fond-prevu); border-radius: 5px; padding: 4px 6px; }
  .carte-sal .dbl-c.r { background: var(--fond-reel); border-left: 0; }
  .carte-sal .dbl { column-gap: 6px; padding-bottom: 4px; }
  @media (max-width: 760px) {
    main { padding: 12px; }
    .barre .titre { min-width: 0; flex: 1; font-size: 15px; }
    .rang .nom-in, .rang .adr-in, .rang .lien-in { width: 100%; min-width: 0; flex: 1 1 100%; }
    .onglet { padding: 8px 11px; }
    .legende { display: none; }
  }
  .cote-a-cote { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; margin: 6px 0; }
  .cote-a-cote > * { min-width: 0; overflow-wrap: anywhere; }
  .cote-a-cote .reel { border-left: 1px solid var(--bord); padding-left: 12px; }
  .cote-a-cote .demi { padding-top: 4px; padding-bottom: 6px; }
  .cote-a-cote .suite { border-top: 1px dashed var(--bord); padding-top: 8px; }
  .actions-jour { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .verrou { color: var(--gris); font-size: 14px; margin-top: 8px; }

  /* ---------- Fenêtre de saisie ---------- */
  .voile { position: fixed; inset: 0; background: rgba(36,30,29,.45); z-index: 40; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 12px; }
  .fenetre { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; padding: 18px; }
  .fenetre h2 { margin: 0 0 2px; font-size: 19px; }
  .fenetre .sous { color: var(--gris); margin-bottom: 14px; }
  .ligne-saisie { border: 1px solid var(--bord); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .champ { display: block; margin-bottom: 10px; }
  .champ > span { display: block; font-size: 13px; font-weight: 700; color: var(--gris); margin-bottom: 4px; }
  .champ select, .champ input { width: 100%; min-height: 46px; padding: 8px 10px; border: 1.5px solid var(--bord); border-radius: 8px; background: #fff; }
  .aide-heure { font-size: 12px; color: var(--gris); margin-top: 6px; }
  .trio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .trio .champ { margin-bottom: 0; }
  .duree { margin-top: 8px; font-size: 14px; color: var(--gris); }
  .case-a-cocher { display: flex; align-items: center; gap: 10px; padding: 12px 0; cursor: pointer; }
  .case-a-cocher input { width: 22px; height: 22px; cursor: pointer; accent-color: var(--rouge); margin: 0; }
  .jours-supp { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .jours-supp .case-a-cocher { padding: 6px 0; }
  .pied { display: flex; gap: 10px; margin-top: 14px; }
  .pied .btn { flex: 1; }
  .fenetre .erreur-saisie { color: var(--rose); font-weight: 500; margin-top: 10px; }

  /* ---------- Responsables ---------- */
  .onglets { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .onglet { border: 1.5px solid var(--bord); background: #fff; border-radius: 10px; padding: 10px 16px; font-weight: 500; min-height: 44px; }
  .onglet.actif { background: var(--rouge); border-color: var(--rouge); color: #fff; font-weight: 700; }
  .barre { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .barre .titre { font-weight: 700; font-size: 17px; min-width: 260px; text-align: center; }
  .barre .espace { flex: 1; }

  .grille-cadre { overflow-x: auto; }
  table.grille { border-collapse: separate; border-spacing: 5px; width: 100%; min-width: 1040px; table-layout: fixed; }
  table.grille th { font-size: 14px; font-weight: 700; color: var(--gris); text-align: left; padding: 2px 4px; }
  table.grille th.auj { color: var(--rouge); }
  table.grille th.col-nom { width: 150px; }
  table.grille td.nom { font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
  .case.case-reel { background: var(--fond-reel); border-color: #BCD4EC; }
  .case.case-reel.auj { border-color: var(--rouge); }
  .simple { width: 100%; padding-bottom: 4px; }
  .simple.suite { border-top: 1px dashed var(--bord); padding-top: 4px; }
  .heures-jour { margin-top: auto; padding-top: 4px; font-size: 13px; font-weight: 700; }

  /* Prévu / Réel : deux fonds, un par colonne ; l'écart ne colore que le contour et le texte */
  .case.cmp .dbl { column-gap: 4px; padding-bottom: 3px; }

  .case.vide-case { color: var(--gris-clair); align-items: center; justify-content: center; font-size: 22px; }
  .case.auj { border-color: var(--rouge); }
  .case.futur { background: #FBFAF9; }

  .case .ecart { font-weight: 700; font-size: 14px; margin-top: 3px; }

  .total { font-size: 14px; vertical-align: top; padding-top: 10px; font-variant-numeric: tabular-nums; }

  .reglages { display: grid; grid-template-columns: 1fr; gap: 18px; }
  .panneau { background: #fff; border: 1px solid var(--bord); border-radius: 14px; padding: 16px; }

  .rang { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--bord); }
  .rang:first-of-type { border-top: 0; }
  .rang input[type=text] { min-height: 40px; padding: 6px 10px; border: 1.5px solid var(--bord); border-radius: 8px; }
  .rang .nom-in { width: 190px; }
  .rang .adr-in { flex: 1; min-width: 220px; }
  .rang .lien-in { flex: 1; min-width: 260px; font-size: 13px; color: var(--gris); background: var(--fond); }
  .rang .case-a-cocher { padding: 6px 0; }
  .inactif { opacity: .55; }
  .titre-impression { display: none; }
  #impression { display: none; }
  .choix-semaines { display: flex; gap: 8px; margin: 6px 0 4px; }
  .choix-semaines .btn { flex: 1; font-size: 18px; }
  table.compteur { border-collapse: collapse; background: #fff; border: 1px solid var(--bord); border-radius: 12px; min-width: 640px; }
  table.compteur th, table.compteur td { padding: 10px 16px; border-bottom: 1px solid var(--bord); text-align: right; font-variant-numeric: tabular-nums; }
  table.compteur th { font-size: 13px; color: var(--gris); font-weight: 700; vertical-align: bottom; }

  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    /* Plusieurs semaines en portrait : seule la zone d'impression sort */
    body.impr-multi header.bandeau, body.impr-multi main { display: none !important; }
    body.impr-multi #impression { display: block; }
    .impr-tete { font-size: 11px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .impr-legende { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; color: var(--gris); }
    .impr-legende .pastille { width: 10px; height: 10px; border-radius: 3px; background: var(--fond-reel); border: 1px solid #BCD4EC; }
    .impr-semaine { break-inside: avoid; page-break-inside: avoid; margin-bottom: 12px; }
    .impr-titre { font-size: 11px; font-weight: 700; margin: 0 0 2px; }
    table.impr { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 8.5px; line-height: 1.25; }
    table.impr th { font-size: 9px; text-align: left; color: var(--gris); padding: 1px 3px; }
    table.impr td { border: 1px solid var(--bord); padding: 2px 3px; vertical-align: top; overflow-wrap: anywhere; }
    table.impr th.n { width: 92px; }

    html, body { background: #fff; }
    header.bandeau, .onglets, .barre, #toast, .voile { display: none !important; }
    main { max-width: none; padding: 0; }

    .case .ch, .dbl .h, .case .h, .heures-jour, .total { font-size: 10px; }
    /* Un document qui sort : pas de couleur d'alerte, les chiffres suffisent */
    .case.cmp.bord-neg, .case.cmp.bord-ok { border-color: var(--bord); }

</style>
