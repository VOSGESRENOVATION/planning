  /** Heures faites (réel saisi) sur chaque chantier pendant la semaine affichée, salarié par salarié. */

  // Sur téléphone, le planning se lit jour par jour : un salarié par carte, assez grande pour le doigt

        else if (r.length) pied = '<span class="' + (tr - tp < 0 ? 'txt-neg' : tr - tp === 0 ? 'txt-ok' : '') + '">' + (tr - tp === 0 ? 'Conforme' : fEcart(tr - tp)) + '</span>';

        return '<div class="comm-lecture"><b>' + esc(nom) + '</b>'
          + (l.chantier ? heure(l.debut) + ' → ' + (l.fin ? heure(l.fin) + (l.pause ? ', pause ' + fh(l.pause) : '') + ' = ' + fh(duree(l)) : 'fin à saisir') : '')
          + (l.chantier && l.remarque ? '<div class="comm">' + esc(l.remarque) + '</div>' : '') + '</div>';

  /** Fenêtre d'une case : le prévu (onglet Planning) ou le réel (onglet Prévu / Réel). */
  function ouvrirJourAdmin(estPrevu, salId, date) {
    var sal = A.init.salaries.filter(function (s) { return s.id === salId; })[0];
    var ch = chantiersParId();
    var prevuJour = parJour(A.d.prevu)[salId + '|' + date] || [];
    var reelJour = parJour(A.d.reel)[salId + '|' + date] || [];
    var existant = estPrevu ? prevuJour : reelJour;
    var depart = existant;
    if (!estPrevu && !existant.length) {
      // Le prévu sert de point de départ, sans recopier les consignes dans le commentaire
      depart = prevuJour.filter(function (l) { return l.chantier; }).map(function (l) { return Object.assign({}, l, { remarque: '' }); });
    }
    fenetreJour({
      titre: (estPrevu ? 'Planning de ' : 'Heures réelles de ') + sal.nom, date: date, lignes: depart,
      chantiers: A.init.chantiers,
      libelleRemarque: estPrevu ? 'Consignes pour ce chantier (une par ligne)' : 'Commentaire du salarié',
      infoHaut: estPrevu ? htmlReelLecture(sal, reelJour, ch) : htmlTextes('Consignes données', prevuJour, ch),
      corrigerReel: date <= A.d.aujourdhui ? function () { ouvrirJourAdmin(false, salId, date); } : null,
      libelleAbsence: estPrevu ? 'Absent ce jour-là (congé, formation…)' : 'N\'a pas travaillé ce jour-là',
      joursSupp: estPrevu ? joursAffiches().filter(function (j) { return j !== date; }) : null,
      autresSalaries: estPrevu ? A.init.salaries.filter(function (x) { return x.actif && x.id !== sal.id; }) : null,
      peutEffacer: existant.length > 0,
      enregistrer: function (lignes, coches, autres) {
        var dates = estPrevu ? [date].concat(coches || []) : [date];
        var sals = estPrevu ? [sal.id].concat(autres || []) : [sal.id];
        envoyer({
          type: estPrevu ? 'prevu' : 'reel', per: A.d, sals: sals, dates: dates, lignes: lignes,
          action: estPrevu ? 'admin.prevu' : 'admin.reel',
          donnees: estPrevu ? { salaries: sals, dates: dates, lignes: lignes } : { salarie: sal.id, date: date, lignes: lignes },
          redessiner: redessinerGrille
        });
      }
    });
  }

  function joursAffiches() {
    var j = [];
    for (var i = 0; i < (A.dimanche ? 7 : 6); i++) j.push(plusJours(A.lundi, i));
    return j;
  }

  /** « 08:00 » → « 8h », « 12:30 » → « 12h30 » : les cases sont étroites. */
  function hc(h) { if (!h) return '…'; var x = String(h).split(':'); return Number(x[0]) + 'h' + (x[1] && x[1] !== '00' ? x[1] : ''); }
  // Une absence de toute la journée (sans heures) compte pour le matin et l'après-midi
  function auMatin(l) { return !l.debut || min(l.debut) < 12 * 60; }
  function aLApresMidi(l) { return !l.debut || (l.fin ? min(l.fin) > 12 * 60 : min(l.debut) >= 12 * 60); } // sans fin : selon l'arrivée
  function dansMoment(l, matin) { return matin ? auMatin(l) : aLApresMidi(l); }
  /**
   * Créneaux à montrer pour le matin ou l'après-midi. Un créneau qui commence avant 12h et finit après
   * est montré coupé : le matin jusqu'à 12h, l'après-midi à partir de 12h + la pause (on suppose la pause
   * prise à midi : l'appli ne connaît pas son heure). Affichage seulement : l'enregistrement ne change pas,
   * et les deux moitiés font le même total que le créneau entier.
   */
  function pourMoment(lignes, matin) {
    return lignes.filter(function (l) { return dansMoment(l, matin); }).map(function (l) {
      if (!l.chantier || !(auMatin(l) && aLApresMidi(l))) return l;
      var pause = Number(l.pause) || 0;
      var reprise = Math.min(12 * 60 + pause, min(l.fin));
      var hhmm = function (m) { return (m < 600 ? '0' : '') + Math.floor(m / 60) + ':' + (m % 60 < 10 ? '0' : '') + (m % 60); };
      return matin
        ? Object.assign({}, l, { fin: '12:00', pause: 0 })
        : Object.assign({}, l, { debut: hhmm(reprise), pause: 0, remarque: '' });
    });
  }

  function lignesCompactes(lignes, ch) {
    return lignes.map(function (l) {
      if (!l.chantier) return '<div class="ch">' + esc(l.remarque || 'Absent') + '</div>';
      var nom = ch[l.chantier] ? ch[l.chantier].nom : l.chantierNom;
      // Fin pas encore mise : « en cours » le jour même, « fin manquante » en rose ensuite (écran du bureau seulement)
      var fin = l.fin ? hc(l.fin) : (l.date && A.d && l.date < A.d.aujourdhui ? '<span class="txt-neg">fin manquante</span>' : 'en cours');
      return '<div class="ch">' + esc(nom) + '</div><div class="h">' + hc(l.debut) + '–<wbr>' + fin + '</div>'
        + (l.pause ? '<div class="h">pause ' + hCourt(l.pause) + '</div>' : '');
    }).join('');
  }

  /** Prévu à gauche, réel à droite ; le matin en haut, l'après-midi en bas (une journée 8h–17h est aux deux). */
  function htmlCaseDouble(p, r, ch, passe) {
    var h = '';
    [true, false].forEach(function (matin) {
      var gp = pourMoment(p, matin);
      var gr = pourMoment(r, matin);
      if (!gp.length && !gr.length) return;
      var attendu = gp.some(function (l) { return l.chantier; });
      h += '<div class="dbl' + (matin ? '' : ' suite') + '"><div class="dbl-c">' + lignesCompactes(gp, ch) + '</div>'
        + '<div class="dbl-c r' + (!gr.length && attendu && passe ? ' manque-r' : '') + '">'
        + (gr.length ? lignesCompactes(gr, ch) : (attendu && passe ? 'à saisir' : '')) + '</div></div>';
    });
    return h;
  }

  /** Petits repères : il y a des consignes (prévu) ou un commentaire du salarié (réel). On les lit en cliquant. */
  function reperes(p, r) {
    var h = '';
    if (p.some(function (l) { return l.chantier && l.remarque; })) h += '<span class="repere">Consignes</span>';
    if (r.some(function (l) { return l.chantier && l.remarque; })) h += '<span class="repere com">Commentaire</span>';
    return h ? '<div class="reperes">' + h + '</div>' : '';
  }

  /** Une journée est complète quand chaque demi-journée prévue a des heures saisies. */
  function journeeComplete(p, r) {
    var attendus = [true, false].filter(function (m) { return pourMoment(p, m).some(function (l) { return l.chantier; }); });
    return attendus.length ? attendus.every(function (m) { return pourMoment(r, m).length; }) : r.length > 0;
  }

  /** Texte à lire dans une fenêtre : consignes ou commentaires, chantier par chantier. */
  function htmlTextes(titre, lignes, ch) {
    var avec = lignes.filter(function (l) { return l.chantier && l.remarque; });
    if (!avec.length) return '';
    var vus = {};
    return '<div class="info-lecture"><div class="bloc-titre">' + esc(titre) + '</div>' + avec.map(function (l) {
      var cle = l.chantier + '|' + l.remarque;
      if (vus[cle]) return '';
      vus[cle] = true;
      return '<div class="comm-lecture"><b>' + esc(ch[l.chantier] ? ch[l.chantier].nom : l.chantierNom) + '</b>' + esc(l.remarque) + '</div>';
    }).join('') + '</div>';
  }

  /** Onglet Planning : pour chaque demi-journée, le réel s'il est saisi, sinon le prévu. */
  function htmlCasePlanning(p, r, ch) {
    var h = '';
    [true, false].forEach(function (matin) {
      var g = pourMoment(r, matin);
      if (!g.length) g = pourMoment(p, matin);
      if (g.length) h += '<div class="simple' + (h ? ' suite' : '') + '">' + lignesCompactes(g, ch) + '</div>';
    });
    return h;
  }

  /** Nombre d'heures sous la case du Planning : faites, prévues, ou ce qu'il reste à saisir. */
  function heuresPlanning(p, r) {
    var tp = total(p), tr = total(r);
    if (!r.length) return tp ? hCourt(tp) + ' prévues' : '';
    if (journeeComplete(p, r)) return hCourt(tr) + ' faites';
    var manque = [true, false].filter(function (m) { return pourMoment(p, m).some(function (l) { return l.chantier; }) && !pourMoment(r, m).length; });
    return hCourt(tr) + ' faites · ' + (manque[0] ? 'matin' : 'après-midi') + ' à saisir';
  }

  /** Une seule série de créneaux : le matin en haut, l'après-midi en bas. */
  function htmlCaseSimple(lignes, ch) {
    var h = '';
    [true, false].forEach(function (matin) {
      var g = pourMoment(lignes, matin);
      if (g.length) h += '<div class="simple' + (h ? ' suite' : '') + '">' + lignesCompactes(g, ch) + '</div>';
    });
    return h;
  }

  function htmlGrille(mode) {
    var ch = chantiersParId();
    var pr = parJour(A.d.prevu), re = parJour(A.d.reel);
    var jours = joursAffiches();
    var auj = A.d.aujourdhui;
    var salaries = A.init.salaries.filter(function (s) {
      return s.actif || jours.some(function (j) { return pr[s.id + '|' + j] || re[s.id + '|' + j]; });
    });

    var h = '<div class="barre">'
      + '<button type="button" class="btn second petit" data-semaine="-7" aria-label="Semaine précédente">◀</button>'
      + '<span class="titre">' + esc(titreSemaine(A.lundi)) + '</span>'
      + '<button type="button" class="btn second petit" data-semaine="7" aria-label="Semaine suivante">▶</button>'
      + (A.lundi !== lundiDe(auj) ? '<button type="button" class="btn second petit" data-semaine="0">Cette semaine</button>' : '')
      + '<label class="case-a-cocher"><input type="checkbox" data-dimanche' + (A.dimanche ? ' checked' : '') + '> Afficher le dimanche</label>'
      + '<span class="espace"></span>'
      + '<button type="button" class="btn second petit" data-imprimer>Exporter en PDF</button>'
      + (mode === 'planning' ? '<span class="legende"><span class="pastille"></span>heures saisies</span><button type="button" class="btn petit" data-recopier>Recopier la semaine précédente</button>' : '')
      + '</div>';

    // Titre qui n'apparaît que sur le PDF
    h += '<div class="titre-impression">Vosges Rénovation — ' + (mode === 'planning' ? 'Planning' : 'Prévu / Réel') + ' — ' + esc(titreSemaine(A.lundi)) + '</div>';
    if (!salaries.length) {
      return h + '<div class="message info">Aucun salarié pour l\'instant. Ajoutez-les dans l\'onglet <b>Réglages</b>.</div>';
    }
    if (estMobile()) return htmlGrilleMobile(mode, h, salaries, ch, pr, re, auj);
    if (!A.init.chantiers.some(function (c) { return c.actif; })) {
      h += '<div class="message info">Aucun chantier pour l\'instant. Ajoutez-les dans l\'onglet <b>Réglages</b> avant de planifier.</div>';
    }

    h += '<div class="grille-cadre"><table class="grille"><thead><tr><th class="col-nom"></th>'
      + jours.map(function (j) {
        return '<th class="' + (j === auj ? 'auj' : '') + '">' + esc(jourCourt(j)) + (j === auj ? '<span class="ecran-seul"> · aujourd\'hui</span>' : '')
          + (mode === 'planning' ? '' : '<div class="sous-th"><span>Prévu</span><span>Réel</span></div>') + '</th>';
      }).join('')
      + '<th class="col-total">Semaine</th></tr></thead><tbody>';

    salaries.forEach(function (s) {
      var totP = 0, totR = 0, totPjusquAuj = 0;
      h += '<tr><td class="nom' + (s.actif ? '' : ' inactif') + '">' + esc(s.nom) + '</td>';
      jours.forEach(function (j) {
        var k = s.id + '|' + j, p = pr[k] || [], r = re[k] || [];
        var tp = total(p), tr = total(r);
        var complete = journeeComplete(p, r);
        totP += tp; totR += tr; if (j < auj || (j === auj && complete)) totPjusquAuj += tp;
        var type = mode === 'planning' ? 'prevu' : 'reel';
        var classes = 'case' + (j === auj ? ' auj' : '') + (j > auj ? ' futur' : '') + (mode === 'planning' ? '' : ' cmp');
        var marque = marqueEnvoi(type, s.id, j);
        if (etatEnvoi(type, s.id, j) === 'erreur') classes += ' ecart-neg';
        var passe = j <= auj;
        var contenu = htmlCaseDouble(p, r, ch, passe);

        if (mode === 'planning') {
          contenu = htmlCasePlanning(p, r, ch);
          if (r.length) classes += ' case-reel';
          contenu += reperes(p, r);
          var hj = heuresPlanning(p, r);
          if (hj) contenu += '<div class="heures-jour">' + hj + '</div>';
          if (!contenu && !marque) { classes += ' vide-case'; contenu = '+'; }
          h += '<td><button type="button" class="' + classes + '" data-prevu="' + k + '" aria-label="Planifier ' + esc(s.nom) + ' le ' + esc(jourLong(j)) + '">'
            + contenu + marque + '</button></td>';
          return;
        }
        // Onglet Prévu / Réel : l'écart du jour en bas de la case
        var ecart = '';
        if (j === auj && !complete) {
          // Journée en cours : pas de rose tant qu'elle n'est pas finie
          if (tp) ecart = '<div class="note">journée en cours</div>';
        } else if (r.length) {
          var ec = tr - tp;
          if (ec < 0) classes += ' bord-neg'; else if (ec === 0) classes += ' bord-ok';
          ecart = '<div class="ecart">' + (ec === 0 ? 'Conforme' : fEcart(ec)) + '</div>';
        } else if (j < auj && tp > 0) {
          classes += ' bord-neg';
          ecart = '<div class="ecart">Pas saisi</div>';
        }
        contenu += reperes(p, r) + ecart + marque;
        if (!contenu) contenu = passe ? '<span class="vide">—</span>' : '';
        h += '<td>' + (passe
          ? '<button type="button" class="' + classes + '" data-reel="' + k + '" aria-label="Corriger le réel de ' + esc(s.nom) + ' le ' + esc(jourLong(j)) + '">' + contenu + '</button>'
          : '<div class="' + classes + '">' + contenu + '</div>') + '</td>';
      });
      if (mode === 'planning') {
        h += '<td class="total">Prévu <b>' + hCourt(totP) + '</b><br>Fait <b>' + hCourt(totR) + '</b></td>';
      } else {
        var ecs = totR - totPjusquAuj;
        h += '<td class="total">Prévu ' + fh(totP) + '<br>Réel <b>' + fh(totR) + '</b>'
          + '<br><span class="' + (ecs < 0 ? 'txt-neg' : ecs === 0 ? 'txt-ok' : '') + '">' + (ecs === 0 ? 'conforme' : fEcart(ecs)) + '</span>'
          + '<div class="note">sur les jours saisis ou passés</div></td>';
      }
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  function htmlReglages() {
    var sansAdresse = !A.init.adresse;
    var h = '<div class="reglages">';
    if (sansAdresse) {
      h += '<div class="message erreur">L\'adresse de l\'appli n\'est pas renseignée : les liens ne peuvent pas être affichés. Collez-la ci-dessous.</div>';
    }
    h += '<div class="panneau"><h3>Salariés</h3><p class="aide">Chaque salarié a son lien personnel : envoyez-le-lui par mail (Copier le lien, puis collez-le dans votre mail). Il ne voit que son planning et ses heures. « Nouveau lien » rend l\'ancien inutilisable (téléphone perdu, départ…).</p>';
    A.init.salaries.forEach(function (s) {
      h += '<div class="rang' + (s.actif ? '' : ' inactif') + '">'
        + '<input type="text" class="nom-in" data-nom="sal|' + s.id + '" value="' + esc(s.nom) + '" aria-label="Nom">'
        + '<label class="case-a-cocher"><input type="checkbox" data-actif="sal|' + s.id + '"' + (s.actif ? ' checked' : '') + '> actif</label>'
        + '<button type="button" class="btn second petit" data-maj="sal|' + s.id + '">Enregistrer</button>'
        + (s.lien ? '<input type="text" class="lien-in" readonly value="' + esc(s.lien) + '" aria-label="Lien"><button type="button" class="btn second petit" data-copier="' + esc(s.lien) + '">Copier le lien</button>' : '')
        + '<button type="button" class="btn second petit" data-code="salarie|' + s.id + '">Nouveau lien</button></div>';
    });
    h += '<div class="rang"><input type="text" class="nom-in" data-nouveau="sal" placeholder="Nom du salarié"><button type="button" class="btn petit" data-ajout="sal">Ajouter le salarié</button></div></div>';

    h += '<div class="panneau"><h3>Chantiers</h3><p class="aide">Un chantier terminé : décochez « actif ». Il disparaît des listes mais son historique reste.</p>';
    A.init.chantiers.forEach(function (c) {
      h += '<div class="rang' + (c.actif ? '' : ' inactif') + '">'
        + '<input type="text" class="nom-in" data-nom="ch|' + c.id + '" value="' + esc(c.nom) + '" aria-label="Nom du chantier">'
        + '<input type="text" class="adr-in" data-adr="ch|' + c.id + '" value="' + esc(c.adresse) + '" placeholder="Adresse" aria-label="Adresse">'
        + '<label class="case-a-cocher"><input type="checkbox" data-actif="ch|' + c.id + '"' + (c.actif ? ' checked' : '') + '> actif</label>'
        + '<button type="button" class="btn second petit" data-maj="ch|' + c.id + '">Enregistrer</button></div>';
    });
    h += '<div class="rang"><input type="text" class="nom-in" data-nouveau="ch" placeholder="Nom du chantier"><input type="text" class="adr-in" data-nouveau-adr placeholder="Adresse"><button type="button" class="btn petit" data-ajout="ch">Ajouter le chantier</button></div></div>';

    h += '<div class="panneau"><h3>Responsables</h3><p class="aide">Ceux qui préparent le planning et voient les heures de tout le monde.</p>';
    A.init.responsables.forEach(function (r) {
      var moi = r.id === A.init.moi.id;
      h += '<div class="rang' + (r.actif ? '' : ' inactif') + '">'
        + '<input type="text" class="nom-in" data-nom="resp|' + r.id + '" value="' + esc(r.nom) + '" aria-label="Nom">'
        + (moi ? '<span class="note">(vous)</span>' : '<label class="case-a-cocher"><input type="checkbox" data-actif="resp|' + r.id + '"' + (r.actif ? ' checked' : '') + '> actif</label>')
        + '<button type="button" class="btn second petit" data-maj="resp|' + r.id + '">Enregistrer</button>'
        + (r.lien ? '<input type="text" class="lien-in" readonly value="' + esc(r.lien) + '" aria-label="Lien"><button type="button" class="btn second petit" data-copier="' + esc(r.lien) + '">Copier le lien</button>' : '')
        + (moi ? '' : '<button type="button" class="btn second petit" data-code="responsable|' + r.id + '">Nouveau lien</button>')
        + '</div>';
    });
    h += '<div class="rang"><input type="text" class="nom-in" data-nouveau="resp" placeholder="Nom"><button type="button" class="btn petit" data-ajout="resp">Ajouter un responsable</button></div></div>';

    h += '<div class="panneau"><h3>Adresse de la page (site gratuit, sans bandeau bleu)</h3><p class="aide">Quand elle est remplie, les liens des salariés et des responsables pointent vers cette page. Laissez vide pour garder les liens Google.</p>'
      + '<div class="rang"><input type="text" class="adr-in" data-adresse-page value="' + esc(A.init.page || '') + '" placeholder="https://vosges-renovation.github.io/planning/"><button type="button" class="btn second petit" data-maj-page>Enregistrer</button></div></div>';
    h += '<div class="panneau"><h3>Adresse de l\'appli</h3><p class="aide">L\'adresse donnée par Google au moment du déploiement (elle finit par /exec). Elle sert à fabriquer les liens.</p>'
      + '<div class="rang"><input type="text" class="adr-in" data-adresse value="' + esc(A.init.adresse) + '" placeholder="https://script.google.com/macros/s/…/exec"><button type="button" class="btn second petit" data-maj-adresse>Enregistrer</button></div></div>';
    return h + '</div>';
  }

  function valeur(sel) { var x = app.querySelector(sel); return x ? x.value : ''; }
  function coche(sel) { var x = app.querySelector(sel); return x ? x.checked : true; }

  function actionAdmin(promesse, message) {
    return promesse.then(function (r) {
      if (r.salaries) A.init = r; else if (r.prevu) fusionner(A.d, r);
      dessinerAdmin();
      if (message) toast(typeof message === 'function' ? message(r) : message);
    }, function (e) { toast(e.message); dessinerAdmin(); });
  }

  app.addEventListener('change', function (e) {
    if (CONF.role !== 'responsable') return;
    if (e.target.hasAttribute('data-dimanche')) { A.dimanche = e.target.checked; dessinerAdmin(); }
  });

  app.addEventListener('click', function (e) {
    if (CONF.role !== 'responsable') return;
    var b = e.target.closest('button');
    if (!b) return;
    var ch = chantiersParId();

    if (b.hasAttribute('data-imprimer')) {
      if (A.onglet === 'planning') { choisirSemaines(); return; }
      toast('Dans la fenêtre qui s\'ouvre, choisissez « Enregistrer au format PDF ».');
      setTimeout(function () { window.print(); }, 300);
      return;
    }
    if (b.hasAttribute('data-tr-ajout')) {
      var tt = valeur('[data-tr-texte]').trim(), tc = valeur('[data-tr-chantier]');
      if (!tt || !tc) { toast('Décrivez le travail et choisissez le chantier.'); return; }
      b.disabled = true;
      actionAdmin(api('admin.travail', { texte: tt, chantier: tc }), 'Travail ajouté ✓');
      return;
    }
    if (b.hasAttribute('data-tr-modif')) {
      var tm = (A.init.travaux || []).filter(function (x) { return x.id === b.getAttribute('data-tr-modif'); })[0];
      if (tm) fenetreTravailAdmin(tm);
      return;
    }
    if (b.hasAttribute('data-tr-rouvrir')) { b.disabled = true; actionAdmin(api('admin.travail', { id: b.getAttribute('data-tr-rouvrir'), rouvrir: true }), 'Travail remis dans la liste'); return; }
    if (b.hasAttribute('data-jourmobile')) { A.jourMobile = b.getAttribute('data-jourmobile'); dessinerAdmin(); return; }
    if (b.hasAttribute('data-onglet')) { A.onglet = b.getAttribute('data-onglet'); dessinerAdmin(); chargerMoisSiBesoin(); return; }
    if (b.hasAttribute('data-mois')) {
      var nm = Number(b.getAttribute('data-mois'));
      A.mois = nm === 0 ? A.d.aujourdhui.slice(0, 7) : moisVoisin(A.mois, nm);
      dessinerAdmin();
      chargerMoisSiBesoin();
      return;
    }
    if (b.hasAttribute('data-semaine')) {
      var n = Number(b.getAttribute('data-semaine'));
      A.lundi = n === 0 ? lundiDe(A.d.aujourdhui) : plusJours(A.lundi, n);
      naviguer(A.d, A.lundi, 'admin.semaine', redessinerGrille);
      return;
    }
    if (b.hasAttribute('data-recopier')) {
      b.disabled = true; b.textContent = 'Recopie…';
      actionAdmin(api('admin.recopier', { lundi: A.lundi }), function (r) {
        return r.copies + ' journée(s) recopiée(s)' + (r.ignores ? ', ' + r.ignores + ' déjà planifiée(s) laissée(s) telle(s) quelle(s)' : '') + '.';
      });
      return;
    }
    if (b.hasAttribute('data-prevu') || b.hasAttribute('data-reel')) {
      var estPrevu = b.hasAttribute('data-prevu');
      var k = b.getAttribute(estPrevu ? 'data-prevu' : 'data-reel').split('|');
      ouvrirJourAdmin(estPrevu, k[0], k[1]);
      return;
    }
    if (b.hasAttribute('data-copier')) {
      var lien = b.getAttribute('data-copier');
      var champ = b.previousElementSibling;
      var fini = function () { toast('Lien copié : collez-le dans votre mail (Ctrl + V).'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(lien).then(fini, function () { champ.select(); document.execCommand('copy'); fini(); });
      else { champ.select(); document.execCommand('copy'); fini(); }
      return;
    }
    var TYPES = { sal: 'admin.salarie', ch: 'admin.chantier', resp: 'admin.responsable' };
    if (b.hasAttribute('data-maj')) {
      var m = b.getAttribute('data-maj'), t = m.split('|')[0], id = m.split('|')[1];
      var d = { id: id, nom: valeur('[data-nom="' + m + '"]'), actif: coche('[data-actif="' + m + '"]') };
      if (t === 'ch') d.adresse = valeur('[data-adr="' + m + '"]');
      b.disabled = true;
      actionAdmin(api(TYPES[t], d), 'Enregistré ✓');
      return;
    }
    if (b.hasAttribute('data-ajout')) {
      var ta = b.getAttribute('data-ajout');
      var da = { nom: valeur('[data-nouveau="' + ta + '"]') };
      if (ta === 'ch') da.adresse = valeur('[data-nouveau-adr]');
      if (!da.nom.trim()) { toast('Indiquez un nom.'); return; }
      b.disabled = true;
      actionAdmin(api(TYPES[ta], da), 'Ajouté ✓');
      return;
    }
    if (b.hasAttribute('data-code')) {
      var c = b.getAttribute('data-code').split('|');
      if (b.getAttribute('data-confirme') !== '1') {
        b.setAttribute('data-confirme', '1'); b.textContent = 'Confirmer : l\'ancien lien ne marchera plus';
        return;
      }
      b.disabled = true;
      actionAdmin(api('admin.nouveauCode', { type: c[0], id: c[1] }), 'Nouveau lien créé : envoyez-le à la personne.');
      return;
    }
    if (b.hasAttribute('data-maj-page')) {
      b.disabled = true;
      actionAdmin(api('admin.adressePage', { adresse: valeur('[data-adresse-page]') }), 'Adresse enregistrée : les liens ont changé, pensez à les renvoyer.');
      return;
    }
    if (b.hasAttribute('data-maj-adresse')) {
      b.disabled = true;
      actionAdmin(api('admin.adresse', { adresse: valeur('[data-adresse]') }), 'Adresse enregistrée ✓');
    }
  });

  // ------------------------------------------------------------------------------------------
  // Démarrage
  // ------------------------------------------------------------------------------------------
  // Un seul appel au démarrage : Google dit qui est là et renvoie ses données
  // Pour ouvrir vite : l'écran vu la dernière fois est gardé sur l'appareil et s'affiche aussitôt,
  // pendant que Google prépare les données fraîches (3 à 10 secondes).
  var CLE_LOCALE = 'planning-chantiers:' + CONF.code;
  function lireLocal() { try { var x = localStorage.getItem(CLE_LOCALE); return x ? JSON.parse(x) : null; } catch (e) { return null; } }
  function ecrireLocal(r) { try { localStorage.setItem(CLE_LOCALE, JSON.stringify({ le: Date.now(), r: r })); } catch (e) { /* appareil plein ou refus : sans gravité */ } }
  function effacerLocal() { try { localStorage.removeItem(CLE_LOCALE); } catch (e) { /* rien */ } }
  function etat(texte, horsLigne) {
    var b = document.getElementById('etat');
    b.textContent = texte || '';
    b.className = 'etat' + (texte ? ' visible' : '') + (horsLigne ? ' hors' : '');
  }
  function afficher(r) { CONF.role = r.role; if (r.role === 'salarie') salarie(r); else responsable(r); }

  if (!CONF.code) erreurPage('Ce lien n\'est pas valable. Demandez votre lien personnel au bureau.');
  else {
    var memo = lireLocal();
    if (memo && memo.r && memo.r.role) {
      try { afficher(memo.r); etat('Mise à jour…'); } catch (e) { memo = null; effacerLocal(); }
    }
    api('demarrer').then(function (r) {
      ecrireLocal(r);
      afficher(r);
      etat('');
    }).catch(function (e) {
      if (memo && !/lien/.test(e.message)) {
        var q = new Date(memo.le);
        etat('Pas de connexion : affichage du ' + q.getDate() + '/' + (q.getMonth() + 1) + ' à ' + q.getHours() + 'h' + (q.getMinutes() < 10 ? '0' : '') + q.getMinutes() + '. Rouvrez la page pour réessayer.', true);
      } else {
        effacerLocal();
        erreurPage(e.message);
      }
    });
  }
})();
